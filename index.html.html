var SITE_NAME = &quot;Bennetstown&quot;;
var SITE_LOC = &quot;Bennetstown 1.01, Dunboyne&quot;;

var repTab = 'site';

function openReport() {
  document.getElementById('rep-overlay').style.display = 'block';
  buildReport();
}

function switchRepTab(tab) {
  repTab = tab;
  document.getElementById('rtab-site').className = tab==='site' ? 'rtab on' : 'rtab';
  document.getElementById('rtab-master').className = tab==='master' ? 'rtab on' : 'rtab';
  document.getElementById('rep-site-sel').style.display = tab==='site' ? 'inline-block' : 'none';
  buildReport();
}

function repRag(z) {
  var a=CATS.filter(function(c){return z.els[c]&amp;&amp;(z.els[c].b>0||z.els[c].l>0);});
  if(!a.length) return 'ns';
  var g=a.reduce(function(s,c){return s+(z.els[c].b-z.els[c].l);},0)/a.length;
  return g<=5?'g':g<=20?'a':'r';
}
function repOvr(z) {
  return Math.round(CATS.map(function(c){return z.els[c]?z.els[c].l:0;}).reduce(function(a,b){return a+b},0)/CATS.length);
}
function repRagLabel(r){return {g:'On programme',a:'At risk',r:'Behind',ns:'Not started'}[r];}
function repPillClass(r){return {g:'rpg',a:'rpa',r:'rpr',ns:'rpn'}[r]||'rpn';}
function repBarColor(gap){return gap<=5?'#639922':gap<=20?'#BA7517':'#E24B4A';}
function repVarHtml(live,base){
  var gap=base-live;
  if(base===0&amp;&amp;live===0) return '<span class=&quot;rv-ok&quot;>-</span>';
  if(gap<=0) return '<span class=&quot;rv-ok&quot;>On</span>';
  return '<span class=&quot;rv-neg&quot;>-'+gap+'%</span>';
}
function repBlockStage(bid){
  var bd=(typeof BDATA!=='undefined')?BDATA[bid]:null;
  if(!bd)return 0;
  if(bd.pps===100)return 5;
  if(bd.ri===100) return 4;
  if(bd.pw===100) return 3;
  if(bd.rw>0)     return 2;
  if(bd.f>0)      return 1;
  return 0;
}
var REP_STAGES=[
  {bg:'#f1f0ec',col:'#888',   bd:'1px solid #ddd',      fw:'400',lbl:'Not started'},
  {bg:'#FAECE7',col:'#712B13',bd:'1px solid #D85A30',   fw:'500',lbl:'Foundations'},
  {bg:'#FAEEDA',col:'#633806',bd:'1px solid #BA7517',   fw:'500',lbl:'Walls'},
  {bg:'#EEEDFE',col:'#3C3489',bd:'1px solid #7F77DD',   fw:'500',lbl:'Pipework'},
  {bg:'#E6F1FB',col:'#0C447C',bd:'1px solid #378ADD',   fw:'500',lbl:'Radon'},
  {bg:'#EAF3DE',col:'#27500A',bd:'1px solid #639922',   fw:'600',lbl:'Slab done'},
];

function buildReport() {
  var today = new Date().toLocaleDateString('en-IE',{day:'2-digit',month:'long',year:'numeric'});
  var week = 'Week 16';
  if(repTab === 'site') {
    buildSiteReport(today, week);
  } else {
    buildMasterReport(today, week);
  }
}

function buildSiteReport(today, week) {
  var body = document.getElementById('rep-body');
  var zones = Object.values(ZD);
  var rags = zones.map(repRag);
  var overall = Math.round(zones.map(repOvr).reduce(function(a,b){return a+b},0)/zones.length);
  var g=rags.filter(function(r){return r==='g';}).length;
  var am=rags.filter(function(r){return r==='a';}).length;
  var rb=rags.filter(function(r){return r==='r';}).length;

  var siteRag = rb>0?'r':am>0?'a':'g';
  var siteName = typeof SITE_NAME !== 'undefined' ? SITE_NAME : 'Site report';
  var siteLoc  = typeof SITE_LOC  !== 'undefined' ? SITE_LOC  : '';

  // Zone rows HTML
  var zoneHtml = '';
  Object.keys(ZD).forEach(function(zid) {
    var z = ZD[zid];
    var r = repRag(z);
    var pct = repOvr(z);
    var rows = CATS.map(function(cat) {
      var d = z.els[cat]||{l:0,b:0};
      var gap = d.b-d.l;
      return '<tr><td>'+cat+'</td><td>'+d.l+'%</td><td>'+d.b+'%</td><td>'+repVarHtml(d.l,d.b)+'</td></tr>';
    }).join('');

    var blkHtml = '';
    if(z.blocks &amp;&amp; z.blocks.length) {
      var leg='<div style=&quot;display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 3px;font-size:8px;align-items:center;&quot;><span style=&quot;color:#aaa;margin-right:2px;&quot;>Stage:</span>'+REP_STAGES.map(function(s){return '<span style=&quot;background:'+s.bg+';color:'+s.col+';border:'+s.bd+';padding:1px 5px;border-radius:3px;&quot;>'+s.lbl+'</span>';}).join('')+'</div>';
      var items='<div class=&quot;rblks&quot;>'+z.blocks.map(function(b){var st=repBlockStage(b);var s=REP_STAGES[st];return '<span title=&quot;'+b+': '+s.lbl+'&quot; style=&quot;display:inline-block;background:'+s.bg+';color:'+s.col+';border:'+s.bd+';font-weight:'+s.fw+';font-size:8px;padding:2px 5px;border-radius:3px;margin:1px;&quot;>'+b+(st===5?' &amp;#10003;':'')+'</span>';}).join('')+'</div>';
      blkHtml=leg+items;
    }

    zoneHtml += '<div class=&quot;rzblock&quot;>'
      +'<div class=&quot;rzhead&quot;><span class=&quot;rzname&quot;>'+z.name+'</span>'+(z.street?'<span class=&quot;rzstreet&quot;>'+z.street+'</span>':'')+'<span class=&quot;rpill '+repPillClass(r)+'&quot;>'+repRagLabel(r)+'</span><span class=&quot;rzovr&quot;>'+pct+'%</span></div>'
      +'<table class=&quot;rztbl&quot;><tr><th>Element</th><th>Live</th><th>Base</th><th>Gap</th></tr>'+rows+'</table>'
      +blkHtml
      +'</div>';
  });

  var html = '<div class=&quot;rpage&quot;>'
    +'<div class=&quot;rh&quot;><div><div class=&quot;rh-title&quot;>'+siteName+' &amp;mdash; site progress report</div><div class=&quot;rh-sub&quot;>'+siteLoc+' &amp;middot; Substructure package &amp;middot; Zone-by-zone breakdown</div></div><div class=&quot;rh-meta&quot;><strong>'+today+'</strong>'+week+'</div></div>'
    +'<div class=&quot;rlabel&quot;>Site summary</div>'
    +'<div class=&quot;rscore&quot;>'
    +'<div class=&quot;rsc&quot;><div class=&quot;rsc-v&quot;>'+overall+'%</div><div class=&quot;rsc-l&quot;>Overall progress</div></div>'
    +'<div class=&quot;rsc&quot;><div class=&quot;rsc-v&quot; style=&quot;color:#3B6D11&quot;>'+g+'</div><div class=&quot;rsc-l&quot;>On programme</div></div>'
    +'<div class=&quot;rsc&quot;><div class=&quot;rsc-v&quot; style=&quot;color:#854F0B&quot;>'+am+'</div><div class=&quot;rsc-l&quot;>At risk</div></div>'
    +'<div class=&quot;rsc&quot;><div class=&quot;rsc-v&quot; style=&quot;color:#A32D2D&quot;>'+rb+'</div><div class=&quot;rsc-l&quot;>Behind</div></div>'
    +'</div>'
    +'<div class=&quot;rai&quot;><div class=&quot;rai-lbl&quot;>AI site summary &amp;amp; priority actions</div><div class=&quot;rai-txt&quot; id=&quot;rep-ai-txt&quot;><span style=&quot;color:#aaa;font-size:10px;&quot;>Loading AI summary...</span></div></div>'
    +'<hr class=&quot;rdivider&quot;>'
    +'<div class=&quot;rlabel&quot;>Zone breakdown</div>'
    +'<div class=&quot;rgrid&quot;>'+zoneHtml+'</div>'
    +'<div class=&quot;rfooter&quot;><span class=&quot;rfooter-txt&quot;>'+siteName+' &amp;middot; Substructure Live Dashboard &amp;middot; Confidential</span><span class=&quot;rfooter-txt&quot;>Page 1 of 1</span></div>'
    +'</div>';

  body.innerHTML = html;
  fetchSiteAI(siteName, siteLoc, zones, overall, g, am, rb);
}

async function fetchSiteAI(siteName, siteLoc, zones, overall, g, am, rb) {
  var lines = Object.keys(ZD).map(function(zid){
    var z=ZD[zid]; var r=repRag(z);
    return z.name+(z.street?' ('+z.street+')':'')+' ['+repRagLabel(r)+']: '+CATS.map(function(c){var d=z.els[c];return c+': '+d.l+'% live vs '+d.b+'% base';}).join(', ');
  }).join('\n');
  var prompt = 'You are an AI assistant for a civils project coordinator. Site: '+siteName+', '+siteLoc+'. Today: '+new Date().toLocaleDateString('en-IE')+'.\n\nZone data:\n'+lines+'\n\nWrite 4 sentences: overall status, most critical zone, biggest element gap, one positive. Then on a new line write exactly &quot;ACTIONS:&quot; followed by 3 numbered priority actions (one sentence each). Be specific and practical.';
  try {
    var res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:prompt}]})});
    var data = await res.json();
    var txt = data.content.find(function(b){return b.type==='text';}).text;
    var parts = txt.split('ACTIONS:');
    var summary = parts[0].trim();
    var actions = parts[1] ? parts[1].trim().split('\n').filter(function(l){return l.trim();}) : [];
    var el = document.getElementById('rep-ai-txt');
    if(el) {
      var actHtml = actions.length ? '<div style=&quot;margin-top:8px;padding-top:8px;border-top:0.5px solid #E24B4A;&quot;><div style=&quot;font-size:8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#A32D2D;margin-bottom:5px;&quot;>Priority actions this week</div>'
        +actions.map(function(a,i){return '<div style=&quot;display:flex;gap:6px;font-size:10px;margin-bottom:3px;align-items:flex-start;&quot;><span style=&quot;background:#E24B4A;color:#fff;font-size:8px;font-weight:700;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;&quot;>'+(i+1)+'</span><span>'+a.replace(/^\d+\.\s*/,'')+'</span></div>';}).join('')+'</div>' : '';
      el.innerHTML = '<span>'+summary+'</span>'+actHtml;
      el.closest('.rai').querySelector('.rai-lbl').textContent = 'AI site summary &amp; priority actions';
    }
  } catch(e) {
    var el2 = document.getElementById('rep-ai-txt');
    if(el2) el2.innerHTML = '<span style=&quot;color:#aaa;font-size:10px;&quot;>AI summary unavailable &amp;mdash; check connection and retry.</span>';
  }
}

function buildMasterReport(today, week) {
  var body = document.getElementById('rep-body');
  var allSiteData = typeof ALL_SITES_DATA !== 'undefined' ? ALL_SITES_DATA : [{name:'This site',loc:'',zd:ZD}];
  var totalG=0,totalA=0,totalR=0,totalSites=allSiteData.length;
  
  var siteRows = allSiteData.map(function(s) {
    var zones=Object.values(s.zd);
    var rags=zones.map(repRag);
    var ovr=Math.round(zones.map(repOvr).reduce(function(a,b){return a+b},0)/zones.length);
    var g=rags.filter(function(r){return r==='g';}).length;
    var am=rags.filter(function(r){return r==='a';}).length;
    var rb=rags.filter(function(r){return r==='r';}).length;
    totalG+=g; totalA+=am; totalR+=rb;
    var sRag=rb>0?'r':am>0?'a':'g';
    
    // Element averages across all zones
    var elRows = CATS.map(function(cat) {

    var ovr=Math.round(zones.map(repOvr).reduce(function(a,b){return a+b},0)/zones.length);
    return s.name+' ['+ovr+'% overall, '+rags.filter(function(r){return r==='r';}).length+' behind, '+rags.filter(function(r){return r==='a';}).length+' at risk]: '
      +CATS.map(function(cat){
        var vals=zones.map(function(z){return z.els[cat]?z.els[cat].l:0;});
        var bvals=zones.map(function(z){return z.els[cat]?z.els[cat].b:0;});
        var live=Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length);
        var base=Math.round(bvals.reduce(function(a,b){return a+b},0)/bvals.length);
        return cat+': '+live+'% live vs '+base+'% base';
      }).join(', ');
  }).join('\n');
  var prompt = 'You are an AI assistant. Civils project coordinator multi-site report. Today: '+new Date().toLocaleDateString('en-IE')+'.\n\n'+lines+'\n\nWrite a 4-sentence executive summary suitable for a director or shareholder: overall programme health, best performing site, most critical site, key risk. Then &quot;ACTIONS:&quot; followed by 3 cross-site priority actions. Be concise and professional.';
  try {
    var res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,messages:[{role:'user',content:prompt}]})});
    var data = await res.json();
    var txt = data.content.find(function(b){return b.type==='text';}).text;
    var parts = txt.split('ACTIONS:');
    var summary = parts[0].trim();
    var actions = parts[1] ? parts[1].trim().split('\n').filter(function(l){return l.trim();}) : [];
    var el = document.getElementById('rep-ai-txt');
    if(el) {
      var actHtml = actions.length ? '<div style=&quot;margin-top:8px;padding-top:8px;border-top:0.5px solid #E24B4A;&quot;><div style=&quot;font-size:8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#A32D2D;margin-bottom:5px;&quot;>Priority actions</div>'
        +actions.map(function(a,i){return '<div style=&quot;display:flex;gap:6px;font-size:10px;margin-bottom:3px;align-items:flex-start;&quot;><span style=&quot;background:#E24B4A;color:#fff;font-size:8px;font-weight:700;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;&quot;>'+(i+1)+'</span><span>'+a.replace(/^\d+\.\s*/,'')+'</span></div>';}).join('')+'</div>' : '';
      el.innerHTML = '<span>'+summary+'</span>'+actHtml;
      el.closest('.rai').querySelector('.rai-lbl').textContent = 'AI executive summary';
    }
  } catch(e) {

  }
}

// Inject into both site dashboards

var CSV_DESC_MAP = {
  'concrete foundations': 'Concrete foundations',
  'rising walls':         'Rising walls',
  &quot;u'slab pipework&quot;:      'Pipework',
  'radon and insulation': 'Radon and Insulation',
  'prep &amp; pour slab':     'Prep and pour slab',
  'prep &amp; pour slab - lvl 01': 'Prep and pour slab',
  'prep &amp; pour slab - lvl 01 ': 'Prep and pour slab',
};
var CAT_TO_BDATA = {
  'Concrete foundations': 'f',
  'Rising walls':         'rw',
  'Pipework':             'pw',
  'Radon and Insulation': 'ri',
  'Prep and pour slab':   'pps'
};

function parseCSV(text) {
  var rows = [];
  var lines = text.split(/\r?\n/);
  var headers = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    // Simple CSV split (handles quoted fields)
    var cols = [];
    var inQ = false, cur = '';
    for (var c = 0; c < line.length; c++) {
      var ch = line[c];
      if (ch === '&quot;') { inQ = !inQ; }
      else if (ch === ',' &amp;&amp; !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    if (!headers) { headers = cols; }
    else {
      var row = {};
      for (var j = 0; j < headers.length; j++) row[headers[j]] = cols[j] || '';
      rows.push(row);
    }
  }
  return rows;
}

function processCSV(text) {
  var rows = parseCSV(text);
  var newBDATA = {};
  var zoneElMap = {};  // zoneElMap[zid][cat] = {lSum, bSum, count}
  var newTF = {};
  var exportDate = '';

  rows.forEach(function(row) {
    var desc  = (row['Activity Description'] || '').trim();
    var zone  = (row['Zone']  || '').trim();
    var block = (row['Block'] || '').trim();
    var live  = parseFloat(row['% Complete Live']     || '0') || 0;
    var base  = parseFloat(row['% Complete Baseline'] || '0') || 0;
    var lf    = (row['Live Finish'] || '').trim();
    if (!exportDate) exportDate = (row['Export Date'] || '').trim();

    if (!zone || zone === '<None>' || !block || block === '<None>') return;

    var descL = desc.toLowerCase();

    // Map to CATS
    var cat = CSV_DESC_MAP[descL] || null;
    if (cat) {
      // Zone-level aggregation
      if (!zoneElMap[zone]) zoneElMap[zone] = {};
      if (!zoneElMap[zone][cat]) zoneElMap[zone][cat] = {lSum:0, bSum:0, count:0};
      zoneElMap[zone][cat].lSum  += live;
      zoneElMap[zone][cat].bSum  += base;
      zoneElMap[zone][cat].count += 1;

      // Block-level
      if (!newBDATA[block]) newBDATA[block] = {f:0, rw:0, pw:0, ri:0, pps:0};
      var key = CAT_TO_BDATA[cat];
      if (key) newBDATA[block][key] = live;
    }

    // TF delivery
    if (descL === 'timberframe delivered') {
      try {
        var parts = lf.split('/');
        if (parts.length === 3) {
          var d = new Date(parseInt(parts[2]), parseInt(parts[0])-1, parseInt(parts[1]));
          var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          newTF[block] = {
            date: d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear(),
            done: live === 100,
            zone: zone
          };
        }
      } catch(e) {}
    }
  });

  // Update ZD els from aggregation
  var updatedZones = 0;
  Object.keys(zoneElMap).forEach(function(zid) {
    if (!ZD[zid]) return;
    updatedZones++;
    CATS.forEach(function(cat) {
      var agg = zoneElMap[zid][cat];
      if (agg &amp;&amp; agg.count > 0) {
        ZD[zid].els[cat] = {
          l: Math.round(agg.lSum / agg.count),
          b: Math.round(agg.bSum / agg.count)
        };
      }
    });
  });

  // Update BDATA
  Object.keys(newBDATA).forEach(function(b) {
    if (BDATA[b]) Object.assign(BDATA[b], newBDATA[b]);
  });

  // Update TF_DATA if present
  if (typeof TF_DATA !== 'undefined') {
    Object.keys(newTF).forEach(function(b) {
      TF_DATA[b] = newTF[b];
    });
  }

  // Update export date badge
  if (exportDate) {
    try {
      var p = exportDate.split('/');
      var d = new Date(parseInt(p[2]), parseInt(p[0])-1, parseInt(p[1]));
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var nice = d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
      document.querySelectorAll('[data-export-badge]').forEach(function(el) {
        el.textContent = 'Data: ' + nice;
      });
    } catch(e) {}
  }

  return {zones: updatedZones, blocks: Object.keys(newBDATA).length, exportDate: exportDate};
}

    e.preventDefault();
    drop.style.borderColor = '#3D5166';
    drop.style.background = '#EEF1F4';
  });
  drop.addEventListener('dragleave', function() {
    drop.style.borderColor = '#d0cec8';
    drop.style.background = '#fafaf8';
  });
  drop.addEventListener('drop', function(e) {
    e.preventDefault();
    drop.style.borderColor = '#d0cec8';
    drop.style.background = '#fafaf8';
    var file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  document.getElementById('csv-file-input').addEventListener('change', function(e) {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    if (!file.name.endsWith('.csv')) {
      status.style.color = '#A32D2D';
      status.textContent = 'Please upload a .csv file.';
      return;
    }
    status.style.color = '#888';
    status.textContent = 'Reading ' + file.name + '...';
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var result = processCSV(e.target.result);
        selZ = null;
        document.getElementById('dptitle').textContent = 'Zone detail';
        document.getElementById('dpempty').style.display = 'block';
        document.getElementById('dpbody').style.display = 'none';
        renderMetrics();
        renderZones();
        status.style.color = '#27500A';
        status.textContent = 'Updated ' + result.zones + ' zones and ' + result.blocks + ' blocks from ' + file.name + '.';
        drop.style.borderColor = '#639922';
        setTimeout(function() { document.getElementById('csv-modal').remove(); }, 1800);
      } catch(err) {
        status.style.color = '#A32D2D';
        status.textContent = 'Error reading file: ' + err.message;
      }
    };
    reader.readAsText(file);
  }
}

  Z007:{name:'Zone 7',street:'',blocks:['B001','B002','B003','B004','B005'],els:{'Concrete foundations':{l:100,b:100},'Rising walls':{l:60,b:50},'Pipework':{l:40,b:60},'Radon and Insulation':{l:20,b:20},'Prep and pour slab':{l:0,b:0}}},
  Z008:{name:'Zone 8',street:'',blocks:['B033','B035'],els:{'Concrete foundations':{l:100,b:100},'Rising walls':{l:100,b:75},'Pipework':{l:100,b:83},'Radon and Insulation':{l:0,b:0},'Prep and pour slab':{l:0,b:0}}},
  Z009:{name:'Zone 9',street:'',blocks:['B034'],els:{'Concrete foundations':{l:100,b:100},'Rising walls':{l:100,b:100},'Pipework':{l:15,b:100},'Radon and Insulation':{l:0,b:75},'Prep and pour slab':{l:0,b:0}}}
};
var ALL_SITES_DATA=[{name:'Corballis 3',loc:'Corballis, Dublin - Phase 2',zd:C3_ZD},{name:'Bennetstown',loc:'Bennetstown 1.01, Dunboyne',zd:BENN_ZD}];
var ZD=C3_ZD;
function repRag(z){var a=CATS.filter(function(c){return z.els[c]&&(z.els[c].b>0||z.els[c].l>0);});if(!a.length)return 'ns';var g=a.reduce(function(s,c){return s+(z.els[c].b-z.els[c].l);},0)/a.length;return g<=5?'g':g<=20?'a':'r';}
function repOvr(z){return Math.round(CATS.map(function(c){return z.els[c]?z.els[c].l:0;}).reduce(function(a,b){return a+b},0)/CATS.length);}
function repRagLabel(r){return {g:'On programme',a:'At risk',r:'Behind',ns:'Not started'}[r]||'Not started';}
function repPillClass(r){return {g:'rpg',a:'rpa',r:'rpr',ns:'rpn'}[r]||'rpn';}
function repBarColor(gap){return gap<=5?'#639922':gap<=20?'#BA7517':'#E24B4A';}
function repVarHtml(l,b){var gap=b-l;if(b===0&&l===0)return '<span class="rv-ok">-</span>';if(gap<=0)return '<span class="rv-ok">On</span>';return '<span class="rv-neg">-'+gap+'%</span>';}
function openMasterReport(){
  document.getElementById('rtab-site').className='rtab';
  document.getElementById('rtab-master').className='rtab on';
  document.getElementById('rep-site-sel').style.display='none';
  document.getElementById('rep-overlay').style.display='block';
  var today=new Date().toLocaleDateString('en-IE',{day:'2-digit',month:'long',year:'numeric'});
  buildMasterReport(today);
}
function switchRepTab(tab){
  document.getElementById('rtab-site').className=tab==='site'?'rtab on':'rtab';
  document.getElementById('rtab-master').className=tab==='master'?'rtab on':'rtab';
  document.getElementById('rep-site-sel').style.display=tab==='site'?'inline-block':'none';
  var today=new Date().toLocaleDateString('en-IE',{day:'2-digit',month:'long',year:'numeric'});
  if(tab==='master')buildMasterReport(today);else buildSiteReport(today);
}
function buildMasterReport(today){
  var body=document.getElementById('rep-body');
  var totalG=0,totalA=0,totalR=0;
  var siteRows=ALL_SITES_DATA.map(function(s){
    var zones=Object.values(s.zd);var rags=zones.map(repRag);
    var ovr=Math.round(zones.map(repOvr).reduce(function(a,b){return a+b},0)/zones.length);
    var g=rags.filter(function(r){return r==='g';}).length;
    var am=rags.filter(function(r){return r==='a';}).length;
    var rb=rags.filter(function(r){return r==='r';}).length;
    totalG+=g;totalA+=am;totalR+=rb;
    var sRag=rb>0?'r':am>0?'a':'g';
    var elRows=CATS.map(function(cat){
      var vals=zones.map(function(z){return z.els[cat]?z.els[cat].l:0;});
      var bvals=zones.map(function(z){return z.els[cat]?z.els[cat].b:0;});
      var live=Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length);
      var base=Math.round(bvals.reduce(function(a,b){return a+b},0)/bvals.length);
      var gap=base-live;var bc=repBarColor(gap);
      return '<tr><td>'+cat+'</td><td>'+live+'%</td><td>'+base+'%</td><td><div class="rbar-cell"><div class="rbar"><div class="rbar-fill" style="width:'+live+'%;background:'+bc+'"></div></div></div></td><td>'+repVarHtml(live,base)+'</td><td><span class="rpill '+repPillClass(gap<=5?'g':gap<=20?'a':'r')+'">'+repRagLabel(gap<=5?'g':gap<=20?'a':'r')+'</span></td></tr>';
    }).join('');
    return '<div class="rsite-hd"><span class="rsite-name">'+s.name+'</span><span class="rpill '+repPillClass(sRag)+'" style="margin-left:8px">'+repRagLabel(sRag)+'</span><span style="font-size:10px;color:#888;margin-left:auto">Overall: '+ovr+'%</span></div><table class="rmaster-tbl"><tr><th style="width:140px">Element</th><th>Live</th><th>Baseline</th><th style="width:90px">Progress</th><th>Gap</th><th>Status</th></tr>'+elRows+'</table>';
  }).join('<hr class="rdivider">');
  body.innerHTML='<div class="rpage"><div class="rh"><div><div class="rh-title">Substructure master progress report</div><div class="rh-sub">Civils Package &middot; All sites &middot; Summary view</div></div><div class="rh-meta"><strong>'+today+'</strong></div></div><div class="rlabel">Overall summary</div><div class="rscore"><div class="rsc"><div class="rsc-v">'+ALL_SITES_DATA.length+'</div><div class="rsc-l">Sites active</div></div><div class="rsc"><div class="rsc-v" style="color:#3B6D11">'+totalG+'</div><div class="rsc-l">On programme</div></div><div class="rsc"><div class="rsc-v" style="color:#854F0B">'+totalA+'</div><div class="rsc-l">At risk</div></div><div class="rsc"><div class="rsc-v" style="color:#A32D2D">'+totalR+'</div><div class="rsc-l">Behind</div></div></div><div class="rai"><div class="rai-lbl">AI executive summary &mdash; generating...</div><div class="rai-txt" id="rep-ai-txt">Please wait...</div></div><hr class="rdivider">'+siteRows+'<div class="rfooter"><span class="rfooter-txt">Substructure Live Dashboard &middot; Confidential</span><span class="rfooter-txt">Page 1 of 1</span></div></div>';
  fetchMasterAI(today);
}
async function fetchMasterAI(today){
  var lines=ALL_SITES_DATA.map(function(s){var zones=Object.values(s.zd);var ovr=Math.round(zones.map(repOvr).reduce(function(a,b){return a+b},0)/zones.length);return s.name+' ['+ovr+'% overall]: '+CATS.map(function(cat){var vals=zones.map(function(z){return z.els[cat]?z.els[cat].l:0;});var bvals=zones.map(function(z){return z.els[cat]?z.els[cat].b:0;});return cat+': '+Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length)+'% vs '+Math.round(bvals.reduce(function(a,b){return a+b},0)/bvals.length)+'%';}).join(', ');}).join('\n');
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:'Multi-site civils report. '+today+'.\n'+lines+'\nWrite 3-sentence executive summary for director. Then ACTIONS: followed by 3 numbered priority actions. Be concise.'}]})});
    var data=await res.json();
    var txt=data.content.find(function(b){return b.type==='text';}).text;
    var parts=txt.split('ACTIONS:');
    var el=document.getElementById('rep-ai-txt');
    if(el){
      var actions=parts[1]?parts[1].trim().split('\n').filter(function(l){return l.trim();}).slice(0,3):[];
      var actHtml=actions.length?'<div style="margin-top:8px;padding-top:8px;border-top:0.5px solid #E24B4A;"><div style="font-size:8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#A32D2D;margin-bottom:4px;">Priority actions</div>'+actions.map(function(a,i){return '<div style="display:flex;gap:6px;font-size:10px;margin-bottom:3px;line-height:1.4;"><span style="background:#E24B4A;color:#fff;font-size:8px;font-weight:700;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:1px;">'+(i+1)+'</span><span>'+a.replace(/^\d+\.\s*/,'')+'</span></div>';}).join('')+'</div>':'';
      el.innerHTML='<span>'+parts[0].trim()+'</span>'+actHtml;
      el.closest('.rai').querySelector('.rai-lbl').textContent='AI executive summary';
    }
  }catch(e){var el2=document.getElementById('rep-ai-txt');if(el2)el2.textContent='Could not generate AI summary.';}
}
function buildSiteReport(today){
  var body=document.getElementById('rep-body');
  var selEl=document.getElementById('rep-site-sel');
  var siteInfo=ALL_SITES_DATA[selEl&&selEl.value==='bennetstown'?1:0];
  var zones=Object.values(siteInfo.zd);var rags=zones.map(repRag);
  var overall=Math.round(zones.map(repOvr).reduce(function(a,b){return a+b},0)/zones.length);
  var g=rags.filter(function(r){return r==='g';}).length;var am=rags.filter(function(r){return r==='a';}).length;var rb=rags.filter(function(r){return r==='r';}).length;
  var zoneHtml='';
  Object.keys(siteInfo.zd).forEach(function(zid){
    var z=siteInfo.zd[zid];var r=repRag(z);var pct=repOvr(z);
    var rows=CATS.map(function(cat){var d=z.els[cat]||{l:0,b:0};return '<tr><td>'+cat+'</td><td>'+d.l+'%</td><td>'+d.b+'%</td><td>'+repVarHtml(d.l,d.b)+'</td></tr>';}).join('');
    var blkHtml=z.blocks&&z.blocks.length?'<div class="rblks">'+z.blocks.map(function(b){return '<span class="rblk rba">'+b+'</span>';}).join('')+'</div>':'';
    zoneHtml+='<div class="rzblock"><div class="rzhead"><span class="rzname">'+z.name+'</span>'+(z.street?'<span class="rzstreet"> &mdash; '+z.street+'</span>':'')+'<span class="rpill '+repPillClass(r)+'">'+repRagLabel(r)+'</span><span class="rzovr">'+pct+'%</span></div><table class="rztbl"><tr><th>Element</th><th>Live</th><th>Base</th><th>Gap</th></tr>'+rows+'</table>'+blkHtml+'</div>';
  });
  body.innerHTML='<div class="rpage"><div class="rh"><div><div class="rh-title">'+siteInfo.name+' &mdash; site report</div><div class="rh-sub">'+siteInfo.loc+' &middot; Substructure &middot; Zone breakdown</div></div><div class="rh-meta"><strong>'+today+'</strong></div></div><div class="rscore"><div class="rsc"><div class="rsc-v">'+overall+'%</div><div class="rsc-l">Overall</div></div><div class="rsc"><div class="rsc-v" style="color:#3B6D11">'+g+'</div><div class="rsc-l">On programme</div></div><div class="rsc"><div class="rsc-v" style="color:#854F0B">'+am+'</div><div class="rsc-l">At risk</div></div><div class="rsc"><div class="rsc-v" style="color:#A32D2D">'+rb+'</div><div class="rsc-l">Behind</div></div></div><hr class="rdivider"><div class="rlabel">Zone breakdown</div><div class="rgrid">'+zoneHtml+'</div><div class="rfooter"><span class="rfooter-txt">'+siteInfo.name+' &middot; Substructure Live Dashboard &middot; Confidential</span><span class="rfooter-txt">Page 1 of 1</span></div></div>';
}
</script>
