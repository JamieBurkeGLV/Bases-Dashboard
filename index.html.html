<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Substructure Live Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f4f1;}
.hdr{padding:14px 14px 0 14px;}
.title{font-size:19px;font-weight:500;margin-bottom:2px;color:#1a1a18;}
.sub{font-size:12px;color:#888;margin-bottom:12px;}
.top-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 14px 12px 14px;}
.tabs{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
.tab{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:12px 16px;cursor:pointer;min-width:180px;flex:1;max-width:280px;transition:border .15s;}
.tab:hover{border-color:#999;}
.tab.active{border:2px solid #3D5166;box-shadow:0 0 0 3px rgba(61,81,102,.15);}
.tab-name{font-size:15px;font-weight:500;margin-bottom:2px;color:#1a1a18;}
.tab-loc{font-size:11px;color:#aaa;}
.mrep-btn{background:#3D5166;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:13px;cursor:pointer;font-family:system-ui;white-space:nowrap;}
.mrep-btn:hover{background:#2C3D4F;}
.frames{width:100%;height:calc(100vh - 130px);}
iframe{width:100%;height:100%;border:none;display:none;}
iframe.active{display:block;}

.rep-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:9999;overflow-y:auto;padding:20px;}
.rep-inner{background:#fff;max-width:760px;margin:0 auto;border-radius:8px;overflow:hidden;}
.rep-toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#f5f4f1;border-bottom:1px solid #e5e4e0;}
.rep-toolbar-title{font-size:13px;font-weight:500;color:#1a1a18;margin-right:auto;}
.rep-tabs{display:flex;gap:6px;}
.rtab{font-size:11px;padding:5px 12px;border-radius:5px;border:1px solid #ddd;cursor:pointer;background:#fff;color:#555;}
.rtab.on{background:#1a1a18;color:#fff;border-color:#1a1a18;}
.rep-close{font-size:18px;background:none;border:none;cursor:pointer;color:#888;padding:0 4px;line-height:1;}
.rep-print-btn{font-size:11px;padding:5px 14px;border-radius:5px;background:#3D5166;color:#fff;border:none;cursor:pointer;}
.rep-site-sel{font-size:11px;padding:5px 8px;border-radius:5px;border:1px solid #ddd;display:none;}
.rep-body{padding:0;}
.rpage{padding:32px 36px;font-family:system-ui,sans-serif;font-size:11px;color:#1a1a18;}
.rh{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid #1a1a18;margin-bottom:16px;}
.rh-title{font-size:17px;font-weight:600;color:#1a1a18;}
.rh-sub{font-size:10px;color:#888;margin-top:3px;}
.rh-meta{text-align:right;font-size:10px;color:#666;}
.rh-meta strong{display:block;font-size:11px;color:#1a1a18;}
.rscore{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.rsc{background:#f8f8f6;border-radius:5px;padding:9px 10px;text-align:center;}
.rsc-v{font-size:19px;font-weight:600;}
.rsc-l{font-size:9px;color:#888;margin-top:1px;}
.rlabel{font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#aaa;margin-bottom:6px;}
.rai{background:#f5f4f1;border-radius:5px;padding:10px 12px;margin-bottom:12px;}
.rai-lbl{font-size:8px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#bbb;margin-bottom:4px;}
.rai-txt{font-size:10.5px;color:#333;line-height:1.6;}
.rpri{border:0.5px solid #E24B4A;border-radius:5px;padding:9px 12px;margin-bottom:12px;}
.rpri-lbl{font-size:8px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#A32D2D;margin-bottom:5px;}
.rpri-item{display:flex;gap:7px;font-size:10.5px;color:#333;margin-bottom:3px;align-items:flex-start;line-height:1.4;}
.rpri-n{background:#E24B4A;color:#fff;font-size:8px;font-weight:700;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.rdivider{border:none;border-top:0.5px solid #e5e4e0;margin:10px 0;}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.rzblock{margin-bottom:2px;}
.rzhead{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.rzname{font-size:11px;font-weight:600;color:#1a1a18;}
.rzstreet{font-size:9px;color:#888;}
.rzovr{font-size:10px;color:#888;margin-left:auto;}
.rpill{font-size:9px;font-weight:500;padding:2px 7px;border-radius:9px;white-space:nowrap;}
.rpg{background:#EAF3DE;color:#27500A;}
.rpa{background:#FAEEDA;color:#633806;}
.rpr{background:#FCEBEB;color:#A32D2D;}
.rpn{background:#F1EFE8;color:#5F5E5A;}
.rztbl{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:5px;}
.rztbl th{text-align:left;color:#aaa;font-weight:400;padding:2px 4px;border-bottom:0.5px solid #eee;font-size:9px;}
.rztbl td{padding:2px 4px;border-bottom:0.5px solid #f5f5f3;color:#333;}
.rztbl td:not(:first-child){text-align:center;}
.rv-neg{color:#A32D2D;font-weight:500;}
.rv-ok{color:#aaa;}
.rblks{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;}
.rblk{font-size:8px;padding:1px 4px;border-radius:3px;border:1px solid;}
.rbg{background:#EAF3DE;color:#27500A;border-color:#639922;}
.rba{background:#FAEEDA;color:#633806;border-color:#BA7517;}
.rbr{background:#FCEBEB;color:#A32D2D;border-color:#E24B4A;}
.rbn{background:#F1EFE8;color:#666;border-color:#ddd;}
.rmaster-tbl{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:10px;}
.rmaster-tbl th{text-align:left;color:#888;font-weight:500;padding:5px 6px;border-bottom:0.5px solid #ddd;font-size:9px;}
.rmaster-tbl td{padding:5px 6px;border-bottom:0.5px solid #f0f0ed;color:#333;}
.rmaster-tbl td:not(:first-child){text-align:center;}
.rbar-cell{display:flex;align-items:center;gap:4px;}
.rbar{flex:1;height:4px;background:#eee;border-radius:2px;overflow:hidden;}
.rbar-fill{height:100%;border-radius:2px;}
.rsite-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.rsite-name{font-size:12px;font-weight:600;}
.rfooter{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:0.5px solid #eee;margin-top:6px;}
.rfooter-txt{font-size:8.5px;color:#aaa;}
.rloading{text-align:center;padding:40px;font-size:13px;color:#888;}
@media print {
  .rep-overlay{display:block !important;position:static !important;background:none !important;padding:0 !important;}
  .rep-toolbar{display:none !important;}
  .rep-inner{border-radius:0;box-shadow:none;}
  body > *:not(.rep-overlay){display:none !important;}
  .rep-overlay > *:not(.rep-inner){display:none !important;}
}

</style>
</head>

// Block colour logic based on most advanced substructure task complete
function blockStage(b) {
  var d = BDATA[b];
  if (!d) return 0;
  if (d.pps === 100) return 5;       // Slab complete
  if (d.ri === 100) return 4;        // Radon &amp; Insulation done
  if (d.pw === 100) return 3;        // Pipework done
  if (d.rw > 0)    return 2;        // Rising walls started/done
  if (d.f > 0)     return 1;        // Foundations started/done
  return 0;                          // Not started
}

function blockLabel(b) {
  var d = BDATA[b]; if (!d) return 'Not started';
  if (d.pps===100) return 'Slab done';
  if (d.ri===100)  return 'Radon done';
  if (d.pw===100)  return 'Pipework done';
  if (d.rw===100)  return 'Walls done';
  if (d.rw>0)      return 'Walls '+d.rw+'%';
  if (d.f===100)   return 'Foundations done';
  if (d.f>0)       return 'Foundations '+d.f+'%';
  return 'Not started';
}

// ---- Calculations ----
function ovr(z) {
  var v = CATS.map(function(c){ return z.els[c] ? z.els[c].l : 0; });
  return Math.round(v.reduce(function(a,b){return a+b},0) / v.length);
}

function rag(z) {
  var a = CATS.filter(function(c){ return z.els[c] &amp;&amp; (z.els[c].b > 0 || z.els[c].l > 0); });
  if (!a.length) return 'ns';
  var gap = a.reduce(function(s,c){ return s + (z.els[c].b - z.els[c].l); }, 0) / a.length;
  return gap <= 5 ? 'g' : gap <= 20 ? 'a' : 'r';
}

// ---- Polygon zone system ----

function frameRect() {
  var f = document.getElementById('map-frame');
  return {width: f.offsetWidth, height: f.offsetHeight};
}

// ════════════════════════════════════════════════════════════════════
// POLYGON ZONE SYSTEM — replaces the rect-only system
// Zones are stored as arrays of [x%, y%] points
// Rectangles are auto-converted on load
// ════════════════════════════════════════════════════════════════════

// Stroke colours for RAG (SVG can't use CSS border shorthand)
var RC_STROKE = {
  g: 'rgba(40,90,5,1)',
  a: 'rgba(110,60,0,1)',
  r: 'rgba(140,25,25,1)',
  ns:'rgba(70,70,65,0.9)'
};

// Convert old {x,y,w,h} rect to polygon points array
function rectToPoly(p) {
  var x=p.x, y=p.y, w=p.w, h=p.h;
  var mx=x+w/2, my=y+h/2;
  // 8 points: TL, T-mid, TR, R-mid, BR, B-mid, BL, L-mid
  return [
    [x,    y   ],
    [mx,   y   ],
    [x+w,  y   ],
    [x+w,  my  ],
    [x+w,  y+h ],
    [mx,   y+h ],
    [x,    y+h ],
    [x,    my  ]
  ];
}

// Ensure a position entry has a points array
function ensurePoly(p) {
  if (p.points) return p;
  return {points: rectToPoly(p), n: p.n||'', s: p.s||''};
}

// Normalise entire pos object — convert any rects to polys
function normPos(raw) {
  var out = {};
  Object.keys(raw).forEach(function(zid){ out[zid] = ensurePoly(raw[zid]); });
  return out;
}

// Centroid of polygon (pixel or percent, same math)
function centroid(pts) {
  var n = pts.length;
  return [
    pts.reduce(function(s,p){return s+p[0];},0)/n,
    pts.reduce(function(s,p){return s+p[1];},0)/n
  ];
}

// Convert percent points → pixel points given frame size
function pctToPx(pts, fw, fh) {
  return pts.map(function(p){ return [(p[0]/100)*fw, (p[1]/100)*fh]; });
}

// SVG points attribute string
function svgPts(pxpts) {
  return pxpts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
}

// ---- Render ----
function renderZones() {
  var fr = frameRect();
  var layer = document.getElementById('zlayer');
  layer.setAttribute('width',  fr.width);
  layer.setAttribute('height', fr.height);
  layer.innerHTML = '';

  Object.keys(pos).forEach(function(zid) {
    var p = pos[zid];
    var z = ZD[zid];
    if (!z || !p.points || !p.points.length) return;

    var r    = rag(z);
    var pct  = ovr(z);
    var isSel = selZ === zid;
    var pxpts = pctToPx(p.points, fr.width, fr.height);
    var ctr   = centroid(pxpts);

    var g = document.createElementNS('http://www.w3.org/2000/svg','g');

    // Zone polygon
    var poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points', svgPts(pxpts));
    poly.style.fill        = RF[r];
    poly.style.stroke      = isSel ? '#3D5166' : RC_STROKE[r];
    poly.style.strokeWidth = isSel ? '3' : '2';
    poly.style.cursor      = editMode ? 'move' : 'pointer';
    g.appendChild(poly);

    // Label — use stored lx/ly if set, otherwise centroid
    var lx = (p.lx !== undefined) ? (p.lx/100)*fr.width  : ctr[0];
    var ly = (p.ly !== undefined) ? (p.ly/100)*fr.height : ctr[1];

    var lblText = p.n + '  ' + pct + '%';
    var pillW = Math.max(44, lblText.length * 7 + 16);

      lblG.addEventListener('touchstart', function(e){ e.stopPropagation(); e.preventDefault(); startDragLabel(e.touches[0], zid, true); }, {passive:false});
    } else {

        circ.style.strokeWidth = '2';
        circ.style.cursor      = 'grab';
        circ.addEventListener('mousedown', function(e){ e.stopPropagation(); startDragVertex(e, zid, idx, false); });
        circ.addEventListener('touchstart', function(e){ e.stopPropagation(); e.preventDefault(); startDragVertex(e.touches[0], zid, idx, true); }, {passive:false});
        // Right-click to delete vertex (min 3 points)
        circ.addEventListener('contextmenu', function(e){
          e.preventDefault();
          if (pos[zid].points.length > 3) {
            pos[zid].points.splice(idx, 1);
            renderZones();
          }
        });
        g.appendChild(circ);
      });

      // Double-click on polygon edge to add vertex
      poly.addEventListener('dblclick', function(e){
        e.stopPropagation();
        var rect = document.getElementById('map-frame').getBoundingClientRect();
        var x = (e.clientX - rect.left) / fr.width * 100;
        var y = (e.clientY - rect.top)  / fr.height * 100;
        // Insert near closest edge midpoint
        var pts = pos[zid].points;
        var best = 0, bestD = Infinity;
        for (var i=0; i<pts.length; i++) {
          var a = pts[i], b = pts[(i+1)%pts.length];
          var mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
          var d = Math.sqrt((x-mx)*(x-mx)+(y-my)*(y-my));
          if (d < bestD) { bestD=d; best=i; }
        }
        pts.splice(best+1, 0, [x, y]);
        renderZones();
      });
    }

    layer.appendChild(g);
  });

  // Draw in-progress new polygon
  if (drawMode &amp;&amp; drawPts.length > 0) {
    var pxdraw = pctToPx(drawPts, fr.width, fr.height);
    if (drawPts.length >= 2) {
      var polyDraw = document.createElementNS('http://www.w3.org/2000/svg','polygon');
      polyDraw.setAttribute('points', svgPts(pxdraw));
      polyDraw.style.fill        = 'rgba(61,81,102,0.18)';
      polyDraw.style.stroke      = '#3D5166';
      polyDraw.style.strokeWidth = '1.5';
      polyDraw.style.strokeDasharray = '5 4';
      polyDraw.style.pointerEvents = 'none';
      layer.appendChild(polyDraw);
    }
    pxdraw.forEach(function(px, i) {
      var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', px[0].toFixed(1));
      c.setAttribute('cy', px[1].toFixed(1));
      c.setAttribute('r', i===0 ? '8' : '5');
      c.style.fill        = i===0 ? '#3D5166' : '#fff';
      c.style.stroke      = '#3D5166';
      c.style.strokeWidth = '2';
      c.style.pointerEvents = 'none';
      layer.appendChild(c);
    });
    // Hint text
    var hint = document.createElementNS('http://www.w3.org/2000/svg','text');
    hint.setAttribute('x', '50%');
    hint.setAttribute('y', '16');
    hint.setAttribute('text-anchor','middle');
    hint.style.cssText = 'font-size:11px;fill:#3D5166;font-family:system-ui;font-weight:600;pointer-events:none;';
    hint.textContent = drawPts.length < 3 ? 'Click to add points — need at least 3' : 'Click near first point (dark circle) to close shape';
    layer.appendChild(hint);
  }
}

// ---- Vertex drag ----
function startDragVertex(e, zid, idx, isTouch) {
  selZ = zid;
  dragV = {
    zid: zid, idx: idx,
    sx: e.clientX, sy: e.clientY,
    origPts: pos[zid].points.map(function(p){return [p[0],p[1]];})
  };
  renderZones();
}

// ---- Label drag ----
function startDragLabel(e, zid, isTouch) {
  var fr = frameRect();
  dragL = {
    zid: zid,
    sx: e.clientX, sy: e.clientY,
    olx: pos[zid].lx !== undefined ? pos[zid].lx : centroid(pctToPx(pos[zid].points, fr.width, fr.height))[0] / fr.width * 100,
    oly: pos[zid].ly !== undefined ? pos[zid].ly : centroid(pctToPx(pos[zid].points, fr.width, fr.height))[1] / fr.height * 100
  };
}

// ---- Zone body drag ----
function startDragZone(e, zid, isTouch) {
  selZ = zid;
  var fr = frameRect();
  dragZ = {
    zid: zid,
    sx: e.clientX, sy: e.clientY,
    origPts: pos[zid].points.map(function(p){return [p[0],p[1]];}),
    fw: fr.width, fh: fr.height
  };
  renderZones();
}

// ---- Unified move ----
function doMove(cx, cy) {
  var fr = frameRect();
  if (dragL) {
    var dx = (cx - dragL.sx) / fr.width  * 100;
    var dy = (cy - dragL.sy) / fr.height * 100;
    pos[dragL.zid].lx = dragL.olx + dx;
    pos[dragL.zid].ly = dragL.oly + dy;
    renderZones();
  }
  if (dragV) {
    var dx = (cx - dragV.sx) / fr.width  * 100;
    var dy = (cy - dragV.sy) / fr.height * 100;
    var newPts = dragV.origPts.map(function(p){return [p[0],p[1]];});
    newPts[dragV.idx] = [
      Math.max(0, Math.min(100, dragV.origPts[dragV.idx][0] + dx)),
      Math.max(0, Math.min(100, dragV.origPts[dragV.idx][1] + dy))
    ];
    pos[dragV.zid].points = newPts;
    document.getElementById('posinfo').textContent = dragV.zid+' vertex '+dragV.idx+': '+newPts[dragV.idx][0].toFixed(1)+'%,'+newPts[dragV.idx][1].toFixed(1)+'%';
    renderZones();
  }
  if (dragZ) {
    var dx2 = (cx - dragZ.sx) / dragZ.fw * 100;
    var dy2 = (cy - dragZ.sy) / dragZ.fh * 100;
    pos[dragZ.zid].points = dragZ.origPts.map(function(p){
      return [Math.max(0,Math.min(100,p[0]+dx2)), Math.max(0,Math.min(100,p[1]+dy2))];
    });
    document.getElementById('posinfo').textContent = dragZ.zid+' moved';
    renderZones();
  }
}

document.addEventListener('mousemove', function(e){ doMove(e.clientX, e.clientY); });
document.addEventListener('mouseup',   function(){  dragV=null; dragZ=null; dragL=null; });
document.addEventListener('touchmove', function(e){
  if (dragV||dragZ){ e.preventDefault(); var t=e.touches[0]; doMove(t.clientX,t.clientY); }
},{passive:false});
document.addEventListener('touchend',  function(){ dragV=null; dragZ=null; dragL=null; });

// ---- Draw mode ----
function startDrawMode(zid) {
  drawMode = true;
  drawPts  = [];
  drawZid  = zid;
  var mf = document.getElementById('map-frame');
  mf.style.cursor = 'crosshair';
  document.getElementById('mapsub').textContent = 'Click to add points. Click near first point to close shape.';
  renderZones();
}

document.getElementById('map-frame').addEventListener('click', function(e){
  if (!drawMode) return;
  var fr   = frameRect();
  var rect = document.getElementById('map-frame').getBoundingClientRect();
  var x = (e.clientX - rect.left) / fr.width  * 100;
  var y = (e.clientY - rect.top)  / fr.height * 100;
  // Close if near first point
  if (drawPts.length >= 3) {
    var fp = drawPts[0];
    var dpx = (x - fp[0]) / 100 * fr.width;
    var dpy = (y - fp[1]) / 100 * fr.height;
    if (Math.sqrt(dpx*dpx+dpy*dpy) < 18) { finishDraw(); return; }
  }
  drawPts.push([x, y]);
  renderZones();
});

function finishDraw() {
  if (drawPts.length >= 3 &amp;&amp; drawZid) {
    var existing = pos[drawZid] || {};
    pos[drawZid] = {points: drawPts.slice(), n: existing.n||(drawZid), s: existing.s||''};
    document.getElementById('mapsub').textContent = 'Shape saved! Move vertices to adjust, or Save layout.';
  }
  drawPts  = [];
  drawMode = false;
  drawZid  = null;
  document.getElementById('map-frame').style.cursor = '';
  renderZones();
}

// Escape key cancels draw

  if (e.key==='Escape' &amp;&amp; drawMode){ drawPts=[]; drawMode=false; drawZid=null; document.getElementById('map-frame').style.cursor=''; document.getElementById('mapsub').textContent='Edit mode: click a zone to reshape'; renderZones(); }

// ── V4: Previous data storage for trend arrows ──────────────────────────
var PREV_KEY = typeof SITE_NAME !== 'undefined'
  ? (SITE_NAME.indexOf('Corballis') > -1 ? 'c3_prev' : 'benn_prev')
  : 'prev_data';

function savePrevData() {
  try {
    var snap = {};
    Object.keys(ZD).forEach(function(zid) {
      snap[zid] = ovr(ZD[zid]);
    });
    snap._tot = Math.round(Object.values(ZD).map(ovr).reduce(function(a,b){return a+b},0)/Object.keys(ZD).length);
    snap._g   = Object.values(ZD).map(rag).filter(function(r){return r==='g';}).length;
    snap._a   = Object.values(ZD).map(rag).filter(function(r){return r==='a';}).length;
    snap._r   = Object.values(ZD).map(rag).filter(function(r){return r==='r';}).length;
    localStorage.setItem(PREV_KEY, JSON.stringify(snap));
  } catch(e) {}
}

function loadPrevData() {
  try {
    var s = localStorage.getItem(PREV_KEY);
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}

function trendArrow(cur, prev) {
  if (prev === null || prev === undefined) return {sym:'', col:'#888', bg:'#f1f0ec'};
  var diff = cur - prev;
  if (diff > 0)  return {sym:'\u2191 +'+diff+'%', col:'#27500A', bg:'#EAF3DE'};
  if (diff < 0)  return {sym:'\u2193 '+diff+'%',  col:'#A32D2D', bg:'#FCEBEB'};
  return            {sym:'\u2192 0%',              col:'#5F5E5A', bg:'#F1EFE8'};
}

function trendArrowCount(cur, prev) {
  if (prev === null || prev === undefined) return {sym:'', col:'#888', bg:'#f1f0ec'};
  var diff = cur - prev;
  if (diff > 0)  return {sym:'\u2191 +'+diff, col:'#27500A', bg:'#EAF3DE'};
  if (diff < 0)  return {sym:'\u2193 '+diff,  col:'#A32D2D', bg:'#FCEBEB'};
  return            {sym:'\u2192',              col:'#5F5E5A', bg:'#F1EFE8'};
}

// ── V4: Alerts panel ─────────────────────────────────────────────────────
function renderAlerts() {
  var alerts = [];
  var today = new Date();

  // 1. TF due within 14 days where slab not complete
  if (typeof TF_DATA !== 'undefined') {
    Object.keys(TF_DATA).forEach(function(b) {
      var tf = TF_DATA[b];
      if (tf.done) return;
      try {
        var parts = tf.date.split(' ');
        var months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
        var tfDate = new Date(parseInt(parts[2]), months[parts[1]], parseInt(parts[0]));
        var days = Math.round((tfDate - today) / 86400000);
        if (days <= 14 &amp;&amp; days >= -3) {
          var slabDone = typeof BDATA !== 'undefined' &amp;&amp; BDATA[b] &amp;&amp; BDATA[b].pps === 100;
          if (!slabDone) {
            var urgency = days <= 3 ? 'r' : days <= 7 ? 'r' : 'a';
            var daysText = days < 0 ? 'OVERDUE by '+ Math.abs(days) +' days' :
                           days === 0 ? 'TODAY' : 'in '+days+' day'+(days===1?'':'s');
            alerts.push({
              level: urgency,
              text: b + ' — TF delivery ' + daysText + '. Slab not complete. Zone: ' + (tf.zone||''),
              site: typeof SITE_NAME !== 'undefined' ? SITE_NAME : ''
            });
          }
        }
      } catch(e) {}
    });
  }

  // 2. Zones >20% behind baseline
  Object.keys(ZD).forEach(function(zid) {
    var z = ZD[zid];
    var active = CATS.filter(function(c){return z.els[c]&amp;&amp;(z.els[c].b>0||z.els[c].l>0);});
    if (!active.length) return;
    var gap = active.reduce(function(s,c){return s+(z.els[c].b-z.els[c].l);},0)/active.length;
    if (gap > 20) {
      alerts.push({
        level: 'r',
        text: z.name+(z.street?' ('+z.street+')':'')+' — '+Math.round(gap)+'% behind baseline on average.',
        site: typeof SITE_NAME !== 'undefined' ? SITE_NAME : ''
      });
    } else if (gap > 10) {
      alerts.push({
        level: 'a',
        text: z.name+(z.street?' ('+z.street+')':'')+' — '+Math.round(gap)+'% behind baseline, at risk.',
        site: typeof SITE_NAME !== 'undefined' ? SITE_NAME : ''
      });
    }
  });

  var panel = document.getElementById('alerts-panel');
  var body  = document.getElementById('alerts-body');
  var count = document.getElementById('alerts-count');

  if (!alerts.length) {
    panel.classList.remove('has-alerts');
    return;
  }

  // Sort: red first
  alerts.sort(function(a,b){ return a.level==='r' &amp;&amp; b.level!=='r' ? -1 : 1; });

  count.textContent = alerts.length + ' alert' + (alerts.length===1?'':'s');
  body.innerHTML = alerts.map(function(a) {
    var col = a.level==='r' ? '#E24B4A' : '#BA7517';
    return '<div class=&quot;alert-row&quot;>'
      +'<div class=&quot;alert-dot&quot; style=&quot;background:'+col+';&quot;></div>'
      +'<div class=&quot;alert-txt&quot;>'+a.text+'</div>'
      +'<div class=&quot;alert-site&quot;>'+a.site+'</div>'
      +'</div>';
  }).join('');
  panel.classList.add('has-alerts');
}

// ── V4: Updated renderMetrics with trend arrows ───────────────────────────
function renderMetrics() {
  var vals  = Object.values(ZD);
  var tot   = Math.round(vals.map(ovr).reduce(function(a,b){return a+b},0) / vals.length);
  var rags  = vals.map(rag);
  var total = vals.length;
  var g     = rags.filter(function(r){return r==='g'}).length;
  var am    = rags.filter(function(r){return r==='a'}).length;
  var rb    = rags.filter(function(r){return r==='r'}).length;
  var prev  = loadPrevData();

  function mbar(label, val, pct, col, ta) {
    var pill = ta.sym ? '<span style=&quot;font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;background:'+ta.bg+';color:'+ta.col+';&quot;>'+ta.sym+'</span>' : '';
    return '<div class=&quot;met&quot;>'
      +'<div style=&quot;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;&quot;>'
      +'<span class=&quot;met-lbl&quot;>'+label+'</span>'
      + pill
      +'</div>'
      +'<div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;&quot;>'
      +'<span style=&quot;font-size:19px;font-weight:600;color:'+col+';&quot;>'+val+'</span>'
      +'</div>'
      +'<div style=&quot;height:5px;background:#eee;border-radius:3px;overflow:hidden;&quot;>'
      +'<div style=&quot;height:100%;width:'+Math.round(pct)+'%;background:'+col+';border-radius:3px;&quot;></div>'
      +'</div>'
      +'</div>';
  }

  document.getElementById('metrics').innerHTML =
    mbar('Overall progress', tot+'%',    tot,             '#3D5166', trendArrow(tot, prev?prev._tot:null)) +
    mbar('On programme',     g+' zones', g/total*100,     '#3B6D11', trendArrowCount(g, prev?prev._g:null)) +
    mbar('At risk',          am+' zones',am/total*100,    '#854F0B', trendArrowCount(am, prev?prev._a:null)) +
    mbar('Behind',           rb+' zones',rb/total*100,    '#A32D2D', trendArrowCount(rb, prev?prev._r:null));

  renderAlerts();
}

function safeRenderZones() {

  var fr = frameRect();

    setTimeout(safeRenderZones, 50);
    return;
  }
  renderZones();
}

var SITE_NAME = &quot;Corballis 3&quot;;
var SITE_LOC = &quot;Corballis, Dublin - Phase 2&quot;;

var repTab = 'site';

function openReport() {
  document.getElementById('rep-overlay').style.display = 'block';
  buildReport();
}

function switchRepTab(tab) {
  repTab = tab;
  document.getElementById('rtab-site').className = tab==='site' ? 'rtab on' : 'rtab';
  document.getElementById('rtab-master').className = tab==='master' ? 'rtab on' : 'rtab';
  document.getElementById('rep-site-sel').style.display = tab==='site' ? 'inline-block' : 'none';
  buildReport();
}

function repRag(z) {
  var a=CATS.filter(function(c){return z.els[c]&amp;&amp;(z.els[c].b>0||z.els[c].l>0);});
  if(!a.length) return 'ns';
  var g=a.reduce(function(s,c){return s+(z.els[c].b-z.els[c].l);},0)/a.length;
  return g<=5?'g':g<=20?'a':'r';
}
function repOvr(z) {
  return Math.round(CATS.map(function(c){return z.els[c]?z.els[c].l:0;}).reduce(function(a,b){return a+b},0)/CATS.length);
}
function repRagLabel(r){return {g:'On programme',a:'At risk',r:'Behind',ns:'Not started'}[r];}
function repPillClass(r){return {g:'rpg',a:'rpa',r:'rpr',ns:'rpn'}[r]||'rpn';}
function repBarColor(gap){return gap<=5?'#639922':gap<=20?'#BA7517':'#E24B4A';}
function repVarHtml(live,base){
  var gap=base-live;
  if(base===0&amp;&amp;live===0) return '<span class=&quot;rv-ok&quot;>-</span>';
  if(gap<=0) return '<span class=&quot;rv-ok&quot;>On</span>';
  return '<span class=&quot;rv-neg&quot;>-'+gap+'%</span>';
}
function repBlockStage(bid){
  var bd=(typeof BDATA!=='undefined')?BDATA[bid]:null;
  if(!bd)return 0;
  if(bd.pps===100)return 5;
  if(bd.ri===100) return 4;
  if(bd.pw===100) return 3;
  if(bd.rw>0)     return 2;
  if(bd.f>0)      return 1;
  return 0;
}
var REP_STAGES=[
  {bg:'#f1f0ec',col:'#888',   bd:'1px solid #ddd',      fw:'400',lbl:'Not started'},
  {bg:'#FAECE7',col:'#712B13',bd:'1px solid #D85A30',   fw:'500',lbl:'Foundations'},
  {bg:'#FAEEDA',col:'#633806',bd:'1px solid #BA7517',   fw:'500',lbl:'Walls'},
  {bg:'#EEEDFE',col:'#3C3489',bd:'1px solid #7F77DD',   fw:'500',lbl:'Pipework'},
  {bg:'#E6F1FB',col:'#0C447C',bd:'1px solid #378ADD',   fw:'500',lbl:'Radon'},
  {bg:'#EAF3DE',col:'#27500A',bd:'1px solid #639922',   fw:'600',lbl:'Slab done'},
];

function buildReport() {
  var today = new Date().toLocaleDateString('en-IE',{day:'2-digit',month:'long',year:'numeric'});
  var week = 'Week 16';
  if(repTab === 'site') {
    buildSiteReport(today, week);
  } else {
    buildMasterReport(today, week);
  }
}

function buildSiteReport(today, week) {
  var body = document.getElementById('rep-body');
  var zones = Object.values(ZD);
  var rags = zones.map(repRag);
  var overall = Math.round(zones.map(repOvr).reduce(function(a,b){return a+b},0)/zones.length);
  var g=rags.filter(function(r){return r==='g';}).length;
  var am=rags.filter(function(r){return r==='a';}).length;
  var rb=rags.filter(function(r){return r==='r';}).length;

  var siteRag = rb>0?'r':am>0?'a':'g';
  var siteName = typeof SITE_NAME !== 'undefined' ? SITE_NAME : 'Site report';
  var siteLoc  = typeof SITE_LOC  !== 'undefined' ? SITE_LOC  : '';

  // Zone rows HTML
  var zoneHtml = '';
  Object.keys(ZD).forEach(function(zid) {
    var z = ZD[zid];
    var r = repRag(z);
    var pct = repOvr(z);
    var rows = CATS.map(function(cat) {
      var d = z.els[cat]||{l:0,b:0};
      var gap = d.b-d.l;
      return '<tr><td>'+cat+'</td><td>'+d.l+'%</td><td>'+d.b+'%</td><td>'+repVarHtml(d.l,d.b)+'</td></tr>';
    }).join('');

    var blkHtml = '';
    if(z.blocks &amp;&amp; z.blocks.length) {
      var leg='<div style=&quot;display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 3px;font-size:8px;align-items:center;&quot;><span style=&quot;color:#aaa;margin-right:2px;&quot;>Stage:</span>'+REP_STAGES.map(function(s){return '<span style=&quot;background:'+s.bg+';color:'+s.col+';border:'+s.bd+';padding:1px 5px;border-radius:3px;&quot;>'+s.lbl+'</span>';}).join('')+'</div>';
      var items='<div class=&quot;rblks&quot;>'+z.blocks.map(function(b){var st=repBlockStage(b);var s=REP_STAGES[st];return '<span title=&quot;'+b+': '+s.lbl+'&quot; style=&quot;display:inline-block;background:'+s.bg+';color:'+s.col+';border:'+s.bd+';font-weight:'+s.fw+';font-size:8px;padding:2px 5px;border-radius:3px;margin:1px;&quot;>'+b+(st===5?' &amp;#10003;':'')+'</span>';}).join('')+'</div>';
      blkHtml=leg+items;
    }

    zoneHtml += '<div class=&quot;rzblock&quot;>'
      +'<div class=&quot;rzhead&quot;><span class=&quot;rzname&quot;>'+z.name+'</span>'+(z.street?'<span class=&quot;rzstreet&quot;>'+z.street+'</span>':'')+'<span class=&quot;rpill '+repPillClass(r)+'&quot;>'+repRagLabel(r)+'</span><span class=&quot;rzovr&quot;>'+pct+'%</span></div>'
      +'<table class=&quot;rztbl&quot;><tr><th>Element</th><th>Live</th><th>Base</th><th>Gap</th></tr>'+rows+'</table>'
      +blkHtml
      +'</div>';
  });

  var html = '<div class=&quot;rpage&quot;>'
    +'<div class=&quot;rh&quot;><div><div class=&quot;rh-title&quot;>'+siteName+' &amp;mdash; site progress report</div><div class=&quot;rh-sub&quot;>'+siteLoc+' &amp;middot; Substructure package &amp;middot; Zone-by-zone breakdown</div></div><div class=&quot;rh-meta&quot;><strong>'+today+'</strong>'+week+'</div></div>'
    +'<div class=&quot;rlabel&quot;>Site summary</div>'
    +'<div class=&quot;rscore&quot;>'
    +'<div class=&quot;rsc&quot;><div class=&quot;rsc-v&quot;>'+overall+'%</div><div class=&quot;rsc-l&quot;>Overall progress</div></div>'
    +'<div class=&quot;rsc&quot;><div class=&quot;rsc-v&quot; style=&quot;color:#3B6D11&quot;>'+g+'</div><div class=&quot;rsc-l&quot;>On programme</div></div>'
    +'<div class=&quot;rsc&quot;><div class=&quot;rsc-v&quot; style=&quot;color:#854F0B&quot;>'+am+'</div><div class=&quot;rsc-l&quot;>At risk</div></div>'
    +'<div class=&quot;rsc&quot;><div class=&quot;rsc-v&quot; style=&quot;color:#A32D2D&quot;>'+rb+'</div><div class=&quot;rsc-l&quot;>Behind</div></div>'
    +'</div>'
    +'<div class=&quot;rai&quot;><div class=&quot;rai-lbl&quot;>AI site summary &amp;amp; priority actions</div><div class=&quot;rai-txt&quot; id=&quot;rep-ai-txt&quot;><span style=&quot;color:#aaa;font-size:10px;&quot;>Loading AI summary...</span></div></div>'
    +'<hr class=&quot;rdivider&quot;>'
    +'<div class=&quot;rlabel&quot;>Zone breakdown</div>'
    +'<div class=&quot;rgrid&quot;>'+zoneHtml+'</div>'
    +'<div class=&quot;rfooter&quot;><span class=&quot;rfooter-txt&quot;>'+siteName+' &amp;middot; Substructure Live Dashboard &amp;middot; Confidential</span><span class=&quot;rfooter-txt&quot;>Page 1 of 1</span></div>'
    +'</div>';

  body.innerHTML = html;
  fetchSiteAI(siteName, siteLoc, zones, overall, g, am, rb);
}

async function fetchSiteAI(siteName, siteLoc, zones, overall, g, am, rb) {
  var lines = Object.keys(ZD).map(function(zid){
    var z=ZD[zid]; var r=repRag(z);
    return z.name+(z.street?' ('+z.street+')':'')+' ['+repRagLabel(r)+']: '+CATS.map(function(c){var d=z.els[c];return c+': '+d.l+'% live vs '+d.b+'% base';}).join(', ');
  }).join('\n');
  var prompt = 'You are an AI assistant for a civils project coordinator. Site: '+siteName+', '+siteLoc+'. Today: '+new Date().toLocaleDateString('en-IE')+'.\n\nZone data:\n'+lines+'\n\nWrite 4 sentences: overall status, most critical zone, biggest element gap, one positive. Then on a new line write exactly &quot;ACTIONS:&quot; followed by 3 numbered priority actions (one sentence each). Be specific and practical.';

// ── CSV UPDATE FEATURE ─────────────────────────────────────────────────────
// Inject into both site dashboards

var CSV_DESC_MAP = {
  'concrete foundations': 'Concrete foundations',
  'rising walls':         'Rising walls',
  &quot;u'slab pipework&quot;:      'Pipework',
  'radon and insulation': 'Radon and Insulation',
  'prep &amp; pour slab':     'Prep and pour slab',
  'prep &amp; pour slab - lvl 01': 'Prep and pour slab',
  'prep &amp; pour slab - lvl 01 ': 'Prep and pour slab',
};
var CAT_TO_BDATA = {
  'Concrete foundations': 'f',
  'Rising walls':         'rw',
  'Pipework':             'pw',
  'Radon and Insulation': 'ri',
  'Prep and pour slab':   'pps'
};

function parseCSV(text) {
  var rows = [];
  var lines = text.split(/\r?\n/);
  var headers = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    // Simple CSV split (handles quoted fields)
    var cols = [];
    var inQ = false, cur = '';
    for (var c = 0; c < line.length; c++) {
      var ch = line[c];
      if (ch === '&quot;') { inQ = !inQ; }
      else if (ch === ',' &amp;&amp; !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    if (!headers) { headers = cols; }
    else {
      var row = {};
      for (var j = 0; j < headers.length; j++) row[headers[j]] = cols[j] || '';
      rows.push(row);
    }
  }
  return rows;
}

function processCSV(text) {
  var rows = parseCSV(text);
  var newBDATA = {};
  var zoneElMap = {};  // zoneElMap[zid][cat] = {lSum, bSum, count}
  var newTF = {};
  var exportDate = '';

  rows.forEach(function(row) {
    var desc  = (row['Activity Description'] || '').trim();
    var zone  = (row['Zone']  || '').trim();
    var block = (row['Block'] || '').trim();
    var live  = parseFloat(row['% Complete Live']     || '0') || 0;
    var base  = parseFloat(row['% Complete Baseline'] || '0') || 0;
    var lf    = (row['Live Finish'] || '').trim();
    if (!exportDate) exportDate = (row['Export Date'] || '').trim();

    if (!zone || zone === '<None>' || !block || block === '<None>') return;

    var descL = desc.toLowerCase();

    // Map to CATS
    var cat = CSV_DESC_MAP[descL] || null;
    if (cat) {
      // Zone-level aggregation
      if (!zoneElMap[zone]) zoneElMap[zone] = {};
      if (!zoneElMap[zone][cat]) zoneElMap[zone][cat] = {lSum:0, bSum:0, count:0};
      zoneElMap[zone][cat].lSum  += live;
      zoneElMap[zone][cat].bSum  += base;
      zoneElMap[zone][cat].count += 1;

      // Block-level
      if (!newBDATA[block]) newBDATA[block] = {f:0, rw:0, pw:0, ri:0, pps:0};
      var key = CAT_TO_BDATA[cat];
      if (key) newBDATA[block][key] = live;
    }

    // TF delivery
    if (descL === 'timberframe delivered') {
      try {
        var parts = lf.split('/');
        if (parts.length === 3) {
          var d = new Date(parseInt(parts[2]), parseInt(parts[0])-1, parseInt(parts[1]));
          var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          newTF[block] = {
            date: d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear(),
            done: live === 100,
            zone: zone
          };
        }
      } catch(e) {}
    }
  });

  // Update ZD els from aggregation
  var updatedZones = 0;
  Object.keys(zoneElMap).forEach(function(zid) {
    if (!ZD[zid]) return;
    updatedZones++;
    CATS.forEach(function(cat) {
      var agg = zoneElMap[zid][cat];
      if (agg &amp;&amp; agg.count > 0) {
        ZD[zid].els[cat] = {
          l: Math.round(agg.lSum / agg.count),
          b: Math.round(agg.bSum / agg.count)
        };
      }
    });
  });

  // Update BDATA
  Object.keys(newBDATA).forEach(function(b) {
    if (BDATA[b]) Object.assign(BDATA[b], newBDATA[b]);
  });

  // Update TF_DATA if present
  if (typeof TF_DATA !== 'undefined') {
    Object.keys(newTF).forEach(function(b) {
      TF_DATA[b] = newTF[b];
    });
  }

  // Update export date badge
  if (exportDate) {
    try {
      var p = exportDate.split('/');
      var d = new Date(parseInt(p[2]), parseInt(p[0])-1, parseInt(p[1]));
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var nice = d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
      document.querySelectorAll('[data-export-badge]').forEach(function(el) {
        el.textContent = 'Data: ' + nice;
      });
    } catch(e) {}
  }

  return {zones: updatedZones, blocks: Object.keys(newBDATA).length, exportDate: exportDate};
}

    + '<div id=&quot;csv-drop&quot; style=&quot;border:2px dashed #d0cec8;border-radius:10px;padding:36px 20px;text-align:center;cursor:pointer;transition:border .15s;background:#fafaf8;&quot;>'
    + '<div style=&quot;font-size:13px;color:#555;margin-bottom:8px;&quot;>Drag and drop your CSV file here</div>'
    + '<div style=&quot;font-size:11px;color:#aaa;margin-bottom:16px;&quot;>or click to browse</div>'
    + '<input type=&quot;file&quot; id=&quot;csv-file-input&quot; accept=&quot;.csv&quot; style=&quot;display:none;&quot;>'
    + '<button onclick=&quot;document.getElementById(\'csv-file-input\').click()&quot; style=&quot;font-size:12px;padding:7px 18px;border-radius:6px;border:1px solid #ddd;cursor:pointer;background:#fff;color:#333;&quot;>Browse files</button>'
    + '</div>'
    + '<div id=&quot;csv-status&quot; style=&quot;margin-top:14px;font-size:12px;color:#888;min-height:18px;&quot;></div>'
    + '<div style=&quot;display:flex;justify-content:flex-end;margin-top:16px;&quot;>'
    + '<button onclick=&quot;document.getElementById(\'csv-modal\').remove()&quot; style=&quot;font-size:12px;padding:7px 18px;border-radius:6px;border:1px solid #ddd;cursor:pointer;background:#fff;color:#555;&quot;>Close</button>'
    + '</div>'
    + '</div>';

  document.body.appendChild(modal);

  // Drag and drop handlers
  var drop = document.getElementById('csv-drop');
  var status = document.getElementById('csv-status');

  drop.addEventListener('dragover', function(e) {
    e.preventDefault();
    drop.style.borderColor = '#3D5166';
    drop.style.background = '#EEF1F4';
  });
  drop.addEventListener('dragleave', function() {
    drop.style.borderColor = '#d0cec8';
    drop.style.background = '#fafaf8';
  });
  drop.addEventListener('drop', function(e) {
    e.preventDefault();
    drop.style.borderColor = '#d0cec8';
    drop.style.background = '#fafaf8';
    var file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  document.getElementById('csv-file-input').addEventListener('change', function(e) {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    if (!file.name.endsWith('.csv')) {
      status.style.color = '#A32D2D';
      status.textContent = 'Please upload a .csv file.';
      return;
    }
    status.style.color = '#888';
    status.textContent = 'Reading ' + file.name + '...';
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var result = processCSV(e.target.result);
        selZ = null;
        document.getElementById('dptitle').textContent = 'Zone detail';
        document.getElementById('dpempty').style.display = 'block';
        document.getElementById('dpbody').style.display = 'none';
        renderMetrics();
        renderZones();
        status.style.color = '#27500A';
        status.textContent = 'Updated ' + result.zones + ' zones and ' + result.blocks + ' blocks from ' + file.name + '.';
        drop.style.borderColor = '#639922';
        setTimeout(function() { document.getElementById('csv-modal').remove(); }, 1800);
      } catch(err) {
        status.style.color = '#A32D2D';
        status.textContent = 'Error reading file: ' + err.message;
      }
    };
    reader.readAsText(file);
  }
}

.edit-on .zb{cursor:grab}
.edit-on .zb:active{cursor:grabbing}
.view-on .zb{cursor:pointer}
.posinfo{font-size:10px;color:#aaa;margin-top:4px;min-height:14px}
.dp{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:14px;position:sticky;top:14px}
.dp h2{font-size:14px;font-weight:500;margin-bottom:8px}
.dp-empty{font-size:13px;color:#bbb;text-align:center;padding:2.5rem 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;margin-bottom:10px}
.pg{background:#EAF3DE;color:#27500A}.pa{background:#FAEEDA;color:#633806}.pr{background:#FCEBEB;color:#A32D2D}.pn{background:#F1EFE8;color:#5F5E5A}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.er{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.en{font-size:11px;color:#666;width:118px;flex-shrink:0}
.eb{flex:1;display:flex;flex-direction:column;gap:2px}
.er2{display:flex;align-items:center;gap:4px}
.el{font-size:9px;color:#aaa;width:20px;flex-shrink:0}
.ebg{flex:1;background:#eee;border-radius:3px;height:5px;overflow:hidden}
.ef{height:100%;border-radius:3px}
.ep{font-size:10px;color:#666;width:24px;text-align:right}
.ev{font-size:10px;width:26px;text-align:right}
.evg{color:#3B6D11}.evr{color:#A32D2D}.evn{color:#bbb}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:4px;margin-top:6px}
.bc{background:#f1f0ec;border-radius:5px;padding:4px 6px;font-size:10px;color:#555;text-align:center}
.sep2{border-top:0.5px solid #eee;margin:8px 0;padding-top:8px;font-size:11px;color:#aaa}
.ai-box{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:14px;margin-top:12px}
.ai-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ai-bg{font-size:11px;background:#EEEDFE;color:#3C3489;border-radius:20px;padding:2px 8px;font-weight:500}
.ai-txt{font-size:13px;color:#555;line-height:1.6;min-height:34px}
.ai-bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.abt{font-size:12px;padding:5px 10px;border-radius:6px;border:0.5px solid #ccc;cursor:pointer;background:transparent;color:#555}
.abt:hover{background:#f1f0ec}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#7F77DD;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:780px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}

.rep-overlay{display:none;position:absolute;top:0;left:0;width:100%;min-height:100%;background:rgba(0,0,0,0.55);z-index:9999;overflow-y:auto;padding:20px;}
.rep-inner{background:#fff;max-width:760px;margin:0 auto;border-radius:8px;overflow:hidden;}
.rep-toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#f5f4f1;border-bottom:1px solid #e5e4e0;}
.rep-toolbar-title{font-size:13px;font-weight:500;color:#1a1a18;margin-right:auto;}
.rep-tabs{display:flex;gap:6px;}
.rtab{font-size:11px;padding:5px 12px;border-radius:5px;border:1px solid #ddd;cursor:pointer;background:#fff;color:#555;}
.rtab.on{background:#1a1a18;color:#fff;border-color:#1a1a18;}
.rep-close{font-size:18px;background:none;border:none;cursor:pointer;color:#888;padding:0 4px;line-height:1;}
.rep-print-btn{font-size:11px;padding:5px 14px;border-radius:5px;background:#3D5166;color:#fff;border:none;cursor:pointer;}
.rep-site-sel{font-size:11px;padding:5px 8px;border-radius:5px;border:1px solid #ddd;display:none;}
.rep-body{padding:0;}
.rpage{padding:32px 36px;font-family:system-ui,sans-serif;font-size:11px;color:#1a1a18;}
.rh{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid #1a1a18;margin-bottom:16px;}
.rh-title{font-size:17px;font-weight:600;color:#1a1a18;}
.rh-sub{font-size:10px;color:#888;margin-top:3px;}
.rh-meta{text-align:right;font-size:10px;color:#666;}
.rh-meta strong{display:block;font-size:11px;color:#1a1a18;}
.rscore{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.rsc{background:#f8f8f6;border-radius:5px;padding:9px 10px;text-align:center;}
.rsc-v{font-size:19px;font-weight:600;}
.rsc-l{font-size:9px;color:#888;margin-top:1px;}
.rlabel{font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#aaa;margin-bottom:6px;}
.rai{background:#f5f4f1;border-radius:5px;padding:10px 12px;margin-bottom:12px;}
.rai-lbl{font-size:8px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#bbb;margin-bottom:4px;}
.rai-txt{font-size:10.5px;color:#333;line-height:1.6;}
.rpri{border:0.5px solid #E24B4A;border-radius:5px;padding:9px 12px;margin-bottom:12px;}
.rpri-lbl{font-size:8px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#A32D2D;margin-bottom:5px;}
.rpri-item{display:flex;gap:7px;font-size:10.5px;color:#333;margin-bottom:3px;align-items:flex-start;line-height:1.4;}
.rpri-n{background:#E24B4A;color:#fff;font-size:8px;font-weight:700;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.rdivider{border:none;border-top:0.5px solid #e5e4e0;margin:10px 0;}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.rzblock{margin-bottom:2px;}
.rzhead{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.rzname{font-size:11px;font-weight:600;color:#1a1a18;}
.rzstreet{font-size:9px;color:#888;}
.rzovr{font-size:10px;color:#888;margin-left:auto;}
.rpill{font-size:9px;font-weight:500;padding:2px 7px;border-radius:9px;white-space:nowrap;}
.rpg{background:#EAF3DE;color:#27500A;}
.rpa{background:#FAEEDA;color:#633806;}
.rpr{background:#FCEBEB;color:#A32D2D;}
.rpn{background:#F1EFE8;color:#5F5E5A;}
.rztbl{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:5px;}
.rztbl th{text-align:left;color:#aaa;font-weight:400;padding:2px 4px;border-bottom:0.5px solid #eee;font-size:9px;}
.rztbl td{padding:2px 4px;border-bottom:0.5px solid #f5f5f3;color:#333;}
.rztbl td:not(:first-child){text-align:center;}
.rv-neg{color:#A32D2D;font-weight:500;}
.rv-ok{color:#aaa;}
.rblks{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;}
.rblk{font-size:8px;padding:1px 4px;border-radius:3px;border:1px solid;}
.rbg{background:#EAF3DE;color:#27500A;border-color:#639922;}
.rba{background:#FAEEDA;color:#633806;border-color:#BA7517;}
.rbr{background:#FCEBEB;color:#A32D2D;border-color:#E24B4A;}
.rbn{background:#F1EFE8;color:#666;border-color:#ddd;}
.rmaster-tbl{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:10px;}
.rmaster-tbl th{text-align:left;color:#888;font-weight:500;padding:5px 6px;border-bottom:0.5px solid #ddd;font-size:9px;}
.rmaster-tbl td{padding:5px 6px;border-bottom:0.5px solid #f0f0ed;color:#333;}
.rmaster-tbl td:not(:first-child){text-align:center;}
.rbar-cell{display:flex;align-items:center;gap:4px;}
.rbar{flex:1;height:4px;background:#eee;border-radius:2px;overflow:hidden;}
.rbar-fill{height:100%;border-radius:2px;}
.rsite-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.rsite-name{font-size:12px;font-weight:600;}
.rfooter{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:0.5px solid #eee;margin-top:6px;}
.rfooter-txt{font-size:8.5px;color:#aaa;}
.rloading{text-align:center;padding:40px;font-size:13px;color:#888;}
@media print {
  .rep-overlay{display:block !important;position:static !important;background:none !important;padding:0 !important;top:auto !important;left:auto !important;}
  .rep-toolbar{display:none !important;}
  .rep-inner{border-radius:0;box-shadow:none;}
  body > *:not(.rep-overlay){display:none !important;}
  .rep-overlay > *:not(.rep-inner){display:none !important;}
}

.alerts-panel{background:#fff;border:1.5px solid #E24B4A;border-radius:10px;padding:11px 14px;margin-bottom:12px;display:none;}
.alerts-panel.has-alerts{display:block;}
.alerts-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.alert-badge{background:#E24B4A;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:auto;}
.alert-title{font-size:12px;font-weight:600;color:#A32D2D;}
.alert-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-top:0.5px solid #fdecea;}
.alert-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.alert-txt{font-size:11px;color:#333;flex:1;line-height:1.45;}
.alert-site{font-size:10px;color:#aaa;white-space:nowrap;padding-top:2px;}
</style>

  if (d.f===100)   return 'Foundations done';
  if (d.f>0)       return 'Foundations '+d.f+'%';
  return 'Not started';
}

// ---- Calculations ----
function ovr(z) {
  var v = CATS.map(function(c){ return z.els[c] ? z.els[c].l : 0; });
  return Math.round(v.reduce(function(a,b){return a+b},0) / v.length);
}

function rag(z) {
  var a = CATS.filter(function(c){ return z.els[c] &amp;&amp; (z.els[c].b > 0 || z.els[c].l > 0); });
  if (!a.length) return 'ns';
  var gap = a.reduce(function(s,c){ return s + (z.els[c].b - z.els[c].l); }, 0) / a.length;
  return gap <= 5 ? 'g' : gap <= 20 ? 'a' : 'r';
}

// ---- Polygon zone system ----

function frameRect() {
  var f = document.getElementById('map-frame');
  return {width: f.offsetWidth, height: f.offsetHeight};
}

// ════════════════════════════════════════════════════════════════════
// POLYGON ZONE SYSTEM — replaces the rect-only system
// Zones are stored as arrays of [x%, y%] points
// Rectangles are auto-converted on load
// ════════════════════════════════════════════════════════════════════

// Stroke colours for RAG (SVG can't use CSS border shorthand)
var RC_STROKE = {
  g: 'rgba(40,90,5,1)',
  a: 'rgba(110,60,0,1)',
  r: 'rgba(140,25,25,1)',
  ns:'rgba(70,70,65,0.9)'
};

// Convert old {x,y,w,h} rect to polygon points array
function rectToPoly(p) {
  var x=p.x, y=p.y, w=p.w, h=p.h;
  var mx=x+w/2, my=y+h/2;
  // 8 points: TL, T-mid, TR, R-mid, BR, B-mid, BL, L-mid
  return [
    [x,    y   ],
    [mx,   y   ],
    [x+w,  y   ],
    [x+w,  my  ],
    [x+w,  y+h ],
    [mx,   y+h ],
    [x,    y+h ],
    [x,    my  ]
  ];
}

// Ensure a position entry has a points array
function ensurePoly(p) {
  if (p.points) return p;
  return {points: rectToPoly(p), n: p.n||'', s: p.s||''};
}

// Normalise entire pos object — convert any rects to polys
function normPos(raw) {
  var out = {};
  Object.keys(raw).forEach(function(zid){ out[zid] = ensurePoly(raw[zid]); });
  return out;
}

// Centroid of polygon (pixel or percent, same math)
function centroid(pts) {
  var n = pts.length;
  return [
    pts.reduce(function(s,p){return s+p[0];},0)/n,
    pts.reduce(function(s,p){return s+p[1];},0)/n
  ];
}

// Convert percent points → pixel points given frame size
function pctToPx(pts, fw, fh) {
  return pts.map(function(p){ return [(p[0]/100)*fw, (p[1]/100)*fh]; });
}

// SVG points attribute string
function svgPts(pxpts) {
  return pxpts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
}

// State
var dragV  = null;  // vertex drag: {zid, idx, sx, sy, origPts}
var dragZ  = null;  // zone move:   {zid, sx, sy, origPts, fw, fh}
var dragL  = null;  // label drag:  {zid, sx, sy, olx, oly}
var drawMode = false;
var drawPts  = [];
var drawZid  = null;

// ---- Render ----
function renderZones() {
  var fr = frameRect();
  var layer = document.getElementById('zlayer');
  layer.setAttribute('width',  fr.width);
  layer.setAttribute('height', fr.height);
  layer.innerHTML = '';

  Object.keys(pos).forEach(function(zid) {
    var p = pos[zid];
    var z = ZD[zid];
    if (!z || !p.points || !p.points.length) return;

    var r    = rag(z);
    var pct  = ovr(z);
    var isSel = selZ === zid;
    var pxpts = pctToPx(p.points, fr.width, fr.height);
    var ctr   = centroid(pxpts);

    var g = document.createElementNS('http://www.w3.org/2000/svg','g');

    // Zone polygon
    var poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points', svgPts(pxpts));
    poly.style.fill        = RF[r];
    poly.style.stroke      = isSel ? '#3D5166' : RC_STROKE[r];
    poly.style.strokeWidth = isSel ? '3' : '2';
    poly.style.cursor      = editMode ? 'move' : 'pointer';
    g.appendChild(poly);

    // Label — use stored lx/ly if set, otherwise centroid
    var lx = (p.lx !== undefined) ? (p.lx/100)*fr.width  : ctr[0];
    var ly = (p.ly !== undefined) ? (p.ly/100)*fr.height : ctr[1];

    var lblText = p.n + '  ' + pct + '%';
    var pillW = Math.max(44, lblText.length * 7 + 16);
    var pillH = 26;

    var lblG = document.createElementNS('http://www.w3.org/2000/svg','g');
    if (editMode) {
      lblG.style.cursor = 'grab';
      lblG.addEventListener('mousedown', function(e){ e.stopPropagation(); startDragLabel(e, zid, false); });
      lblG.addEventListener('touchstart', function(e){ e.stopPropagation(); e.preventDefault(); startDragLabel(e.touches[0], zid, true); }, {passive:false});
    } else {
      lblG.style.pointerEvents = 'none';
    }

    var pill = document.createElementNS('http://www.w3.org/2000/svg','rect');
    pill.setAttribute('x',      (lx - pillW/2).toFixed(1));
    pill.setAttribute('y',      (ly - pillH/2).toFixed(1));
    pill.setAttribute('width',  pillW);
    pill.setAttribute('height', pillH);
    pill.setAttribute('rx',     '5');
    pill.style.fill        = 'rgba(255,255,255,0.92)';
    pill.style.stroke      = editMode ? '#3D5166' : 'rgba(0,0,0,0.12)';
    pill.style.strokeWidth = editMode ? '1.5' : '0.5';
    pill.style.strokeDasharray = editMode ? '4 3' : 'none';
    lblG.appendChild(pill);

    var nameT = document.createElementNS('http://www.w3.org/2000/svg','text');
    nameT.setAttribute('x', (lx - 2).toFixed(1));
    nameT.setAttribute('y', (ly + 4).toFixed(1));
    nameT.setAttribute('text-anchor','end');
    nameT.style.cssText = 'font-size:11px;font-weight:700;font-family:system-ui,sans-serif;fill:#1a1a18;';
    nameT.textContent = p.n;
    lblG.appendChild(nameT);

    var sep = document.createElementNS('http://www.w3.org/2000/svg','text');
    sep.setAttribute('x', lx.toFixed(1));
    sep.setAttribute('y', (ly + 4).toFixed(1));
    sep.setAttribute('text-anchor','middle');
    sep.style.cssText = 'font-size:10px;font-family:system-ui,sans-serif;fill:#bbb;';
    sep.textContent = '|';
    lblG.appendChild(sep);

    var pctT = document.createElementNS('http://www.w3.org/2000/svg','text');
    pctT.setAttribute('x', (lx + 3).toFixed(1));
    pctT.setAttribute('y', (ly + 4).toFixed(1));
    pctT.setAttribute('text-anchor','start');
    pctT.style.cssText = 'font-size:11px;font-weight:600;font-family:system-ui,sans-serif;fill:#555;';
    var prevD = loadPrevData();
    var prevPct = prevD ? prevD[zid] : null;
    var ta = trendArrow(pct, prevPct);
    pctT.textContent = pct + '%' + (ta.sym ? '  '+ta.sym : '');
    lblG.appendChild(pctT);

    g.appendChild(lblG);

    // Interaction
    if (!editMode) {
      g.style.cursor = 'pointer';
      poly.addEventListener('mousedown', function(e){ e.stopPropagation(); showDetail(zid); });
      poly.addEventListener('touchstart', function(e){ e.stopPropagation(); showDetail(zid); }, {passive:true});
    } else {
      // Drag whole zone
      poly.addEventListener('mousedown', function(e){ e.stopPropagation(); startDragZone(e, zid, false); });
      poly.addEventListener('touchstart', function(e){ e.stopPropagation(); e.preventDefault(); startDragZone(e.touches[0], zid, true); }, {passive:false});

      // Vertex handles
      p.points.forEach(function(pt, idx) {
        var px = (pt[0]/100)*fr.width;
        var py = (pt[1]/100)*fr.height;
        var circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
        circ.setAttribute('cx', px.toFixed(1));
        circ.setAttribute('cy', py.toFixed(1));
        circ.setAttribute('r', '7');
        circ.style.fill        = '#fff';
        circ.style.stroke      = '#3D5166';
        circ.style.strokeWidth = '2';
        circ.style.cursor      = 'grab';
        circ.addEventListener('mousedown', function(e){ e.stopPropagation(); startDragVertex(e, zid, idx, false); });
        circ.addEventListener('touchstart', function(e){ e.stopPropagation(); e.preventDefault(); startDragVertex(e.touches[0], zid, idx, true); }, {passive:false});
        // Right-click to delete vertex (min 3 points)
        circ.addEventListener('contextmenu', function(e){
          e.preventDefault();
          if (pos[zid].points.length > 3) {
            pos[zid].points.splice(idx, 1);
            renderZones();
          }
        });
        g.appendChild(circ);
      });

      // Double-click on polygon edge to add vertex
      poly.addEventListener('dblclick', function(e){
        e.stopPropagation();
        var rect = document.getElementById('map-frame').getBoundingClientRect();
        var x = (e.clientX - rect.left) / fr.width * 100;
        var y = (e.clientY - rect.top)  / fr.height * 100;
        // Insert near closest edge midpoint
        var pts = pos[zid].points;
        var best = 0, bestD = Infinity;
        for (var i=0; i<pts.length; i++) {
          var a = pts[i], b = pts[(i+1)%pts.length];
          var mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
          var d = Math.sqrt((x-mx)*(x-mx)+(y-my)*(y-my));
          if (d < bestD) { bestD=d; best=i; }
        }
        pts.splice(best+1, 0, [x, y]);
        renderZones();
      });
    }

    layer.appendChild(g);
  });

  // Draw in-progress new polygon
  if (drawMode &amp;&amp; drawPts.length > 0) {
    var pxdraw = pctToPx(drawPts, fr.width, fr.height);
    if (drawPts.length >= 2) {
      var polyDraw = document.createElementNS('http://www.w3.org/2000/svg','polygon');
      polyDraw.setAttribute('points', svgPts(pxdraw));
      polyDraw.style.fill        = 'rgba(61,81,102,0.18)';
      polyDraw.style.stroke      = '#3D5166';
      polyDraw.style.strokeWidth = '1.5';
      polyDraw.style.strokeDasharray = '5 4';
      polyDraw.style.pointerEvents = 'none';
      layer.appendChild(polyDraw);
    }
    pxdraw.forEach(function(px, i) {
      var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', px[0].toFixed(1));
      c.setAttribute('cy', px[1].toFixed(1));
      c.setAttribute('r', i===0 ? '8' : '5');
      c.style.fill        = i===0 ? '#3D5166' : '#fff';
      c.style.stroke      = '#3D5166';
      c.style.strokeWidth = '2';
      c.style.pointerEvents = 'none';
      layer.appendChild(c);
    });
    // Hint text
    var hint = document.createElementNS('http://www.w3.org/2000/svg','text');
    hint.setAttribute('x', '50%');
    hint.setAttribute('y', '16');
    hint.setAttribute('text-anchor','middle');
    hint.style.cssText = 'font-size:11px;fill:#3D5166;font-family:system-ui;font-weight:600;pointer-events:none;';
    hint.textContent = drawPts.length < 3 ? 'Click to add points — need at least 3' : 'Click near first point (dark circle) to close shape';
    layer.appendChild(hint);
  }
}

// ---- Vertex drag ----
function startDragVertex(e, zid, idx, isTouch) {
  selZ = zid;
  dragV = {
    zid: zid, idx: idx,
    sx: e.clientX, sy: e.clientY,
    origPts: pos[zid].points.map(function(p){return [p[0],p[1]];})
  };
  renderZones();
}

// ---- Label drag ----
function startDragLabel(e, zid, isTouch) {
  var fr = frameRect();
  dragL = {
    zid: zid,
    sx: e.clientX, sy: e.clientY,
    olx: pos[zid].lx !== undefined ? pos[zid].lx : centroid(pctToPx(pos[zid].points, fr.width, fr.height))[0] / fr.width * 100,
    oly: pos[zid].ly !== undefined ? pos[zid].ly : centroid(pctToPx(pos[zid].points, fr.width, fr.height))[1] / fr.height * 100
  };
}

// ---- Zone body drag ----
function startDragZone(e, zid, isTouch) {
  selZ = zid;
  var fr = frameRect();
  dragZ = {
    zid: zid,
    sx: e.clientX, sy: e.clientY,
    origPts: pos[zid].points.map(function(p){return [p[0],p[1]];}),
    fw: fr.width, fh: fr.height
  };
  renderZones();
}

// ---- Unified move ----
function doMove(cx, cy) {
  var fr = frameRect();
  if (dragL) {
    var dx = (cx - dragL.sx) / fr.width  * 100;
    var dy = (cy - dragL.sy) / fr.height * 100;
    pos[dragL.zid].lx = dragL.olx + dx;
    pos[dragL.zid].ly = dragL.oly + dy;
    renderZones();
  }
  if (dragV) {
    var dx = (cx - dragV.sx) / fr.width  * 100;
    var dy = (cy - dragV.sy) / fr.height * 100;
    var newPts = dragV.origPts.map(function(p){return [p[0],p[1]];});
    newPts[dragV.idx] = [
      Math.max(0, Math.min(100, dragV.origPts[dragV.idx][0] + dx)),
      Math.max(0, Math.min(100, dragV.origPts[dragV.idx][1] + dy))
    ];
    pos[dragV.zid].points = newPts;
    document.getElementById('posinfo').textContent = dragV.zid+' vertex '+dragV.idx+': '+newPts[dragV.idx][0].toFixed(1)+'%,'+newPts[dragV.idx][1].toFixed(1)+'%';
    renderZones();
  }
  if (dragZ) {
    var dx2 = (cx - dragZ.sx) / dragZ.fw * 100;
    var dy2 = (cy - dragZ.sy) / dragZ.fh * 100;
    pos[dragZ.zid].points = dragZ.origPts.map(function(p){
      return [Math.max(0,Math.min(100,p[0]+dx2)), Math.max(0,Math.min(100,p[1]+dy2))];
    });
    document.getElementById('posinfo').textContent = dragZ.zid+' moved';
    renderZones();
  }
}

document.addEventListener('mousemove', function(e){ doMove(e.clientX, e.clientY); });
document.addEventListener('mouseup',   function(){  dragV=null; dragZ=null; dragL=null; });
document.addEventListener('touchmove', function(e){
  if (dragV||dragZ){ e.preventDefault(); var t=e.touches[0]; doMove(t.clientX,t.clientY); }
},{passive:false});
document.addEventListener('touchend',  function(){ dragV=null; dragZ=null; dragL=null; });

// ---- Draw mode ----
function startDrawMode(zid) {
  drawMode = true;
  drawPts  = [];
  drawZid  = zid;
  var mf = document.getElementById('map-frame');
  mf.style.cursor = 'crosshair';
  document.getElementById('mapsub').textContent = 'Click to add points. Click near first point to close shape.';
  renderZones();
}

document.getElementById('map-frame').addEventListener('click', function(e){
  if (!drawMode) return;
  var fr   = frameRect();
  var rect = document.getElementById('map-frame').getBoundingClientRect();
  var x = (e.clientX - rect.left) / fr.width  * 100;
  var y = (e.clientY - rect.top)  / fr.height * 100;
  // Close if near first point
  if (drawPts.length >= 3) {
    var fp = drawPts[0];
    var dpx = (x - fp[0]) / 100 * fr.width;
    var dpy = (y - fp[1]) / 100 * fr.height;
    if (Math.sqrt(dpx*dpx+dpy*dpy) < 18) { finishDraw(); return; }
  }
  drawPts.push([x, y]);
  renderZones();
});

function finishDraw() {
  if (drawPts.length >= 3 &amp;&amp; drawZid) {
    var existing = pos[drawZid] || {};
    pos[drawZid] = {points: drawPts.slice(), n: existing.n||(drawZid), s: existing.s||''};
    document.getElementById('mapsub').textContent = 'Shape saved! Move vertices to adjust, or Save layout.';
  }
  drawPts  = [];
  drawMode = false;
  drawZid  = null;
  document.getElementById('map-frame').style.cursor = '';
  renderZones();
}

// Escape key cancels draw
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' &amp;&amp; drawMode){ drawPts=[]; drawMode=false; drawZid=null; document.getElementById('map-frame').style.cursor=''; document.getElementById('mapsub').textContent='Edit mode: click a zone to reshape'; renderZones(); }
});


// ---- Detail panel ----
function showDetail(zid) {
  selZ = zid;
  var z = ZD[zid];
  var r = rag(z);
  document.getElementById('dptitle').textContent = z.name + ' — ' + z.street;
  document.getElementById('dpempty').style.display = 'none';
  var body = document.getElementById('dpbody');
  body.style.display = 'block';
  var dc = r === 'ns' ? '#888' : RC[r];
  var pc = {g:'pg',a:'pa',r:'pr',ns:'pn'}[r];
  var h = '<div class=&quot;pill ' + pc + '&quot;><span class=&quot;dot&quot; style=&quot;background:' + dc + '&quot;></span>' + RL[r] + ' — ' + ovr(z) + '% overall</div>';
  CATS.forEach(function(cat) {
    var d = z.els[cat] || {l:0,b:0};
    var gap = d.b - d.l;
    var bc = (d.b===0&amp;&amp;d.l===0) ? '#B4B2A9' : gap<=5 ? '#639922' : gap<=20 ? '#BA7517' : '#E24B4A';

// ---- Timberframe delivery sequence for this zone ----

// ── V4: Previous data storage for trend arrows ──────────────────────────
var PREV_KEY = typeof SITE_NAME !== 'undefined'
  ? (SITE_NAME.indexOf('Corballis') > -1 ? 'c3_prev' : 'benn_prev')
  : 'prev_data';

function savePrevData() {
  try {
    var snap = {};
    Object.keys(ZD).forEach(function(zid) {
      snap[zid] = ovr(ZD[zid]);
    });
    snap._tot = Math.round(Object.values(ZD).map(ovr).reduce(function(a,b){return a+b},0)/Object.keys(ZD).length);
    snap._g   = Object.values(ZD).map(rag).filter(function(r){return r==='g';}).length;
    snap._a   = Object.values(ZD).map(rag).filter(function(r){return r==='a';}).length;
    snap._r   = Object.values(ZD).map(rag).filter(function(r){return r==='r';}).length;
    localStorage.setItem(PREV_KEY, JSON.stringify(snap));
  } catch(e) {}
}

function loadPrevData() {
  try {
    var s = localStorage.getItem(PREV_KEY);
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}

function trendArrow(cur, prev) {
  if (prev === null || prev === undefined) return {sym:'', col:'#888', bg:'#f1f0ec'};
  var diff = cur - prev;
  if (diff > 0)  return {sym:'\u2191 +'+diff+'%', col:'#27500A', bg:'#EAF3DE'};
  if (diff < 0)  return {sym:'\u2193 '+diff+'%',  col:'#A32D2D', bg:'#FCEBEB'};
  return            {sym:'\u2192 0%',              col:'#5F5E5A', bg:'#F1EFE8'};
}

function trendArrowCount(cur, prev) {
  if (prev === null || prev === undefined) return {sym:'', col:'#888', bg:'#f1f0ec'};
  var diff = cur - prev;
  if (diff > 0)  return {sym:'\u2191 +'+diff, col:'#27500A', bg:'#EAF3DE'};
  if (diff < 0)  return {sym:'\u2193 '+diff,  col:'#A32D2D', bg:'#FCEBEB'};
  return            {sym:'\u2192',              col:'#5F5E5A', bg:'#F1EFE8'};
}

// ── V4: Alerts panel ─────────────────────────────────────────────────────
function renderAlerts() {
  var alerts = [];
  var today = new Date();

  // 1. TF due within 14 days where slab not complete
  if (typeof TF_DATA !== 'undefined') {
    Object.keys(TF_DATA).forEach(function(b) {
      var tf = TF_DATA[b];
      if (tf.done) return;
      try {
        var parts = tf.date.split(' ');
        var months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
        var tfDate = new Date(parseInt(parts[2]), months[parts[1]], parseInt(parts[0]));
        var days = Math.round((tfDate - today) / 86400000);
        if (days <= 14 &amp;&amp; days >= -3) {
          var slabDone = typeof BDATA !== 'undefined' &amp;&amp; BDATA[b] &amp;&amp; BDATA[b].pps === 100;
          if (!slabDone) {
            var urgency = days <= 3 ? 'r' : days <= 7 ? 'r' : 'a';
            var daysText = days < 0 ? 'OVERDUE by '+ Math.abs(days) +' days' :
                           days === 0 ? 'TODAY' : 'in '+days+' day'+(days===1?'':'s');
            alerts.push({
              level: urgency,
              text: b + ' — TF delivery ' + daysText + '. Slab not complete. Zone: ' + (tf.zone||''),
              site: typeof SITE_NAME !== 'undefined' ? SITE_NAME : ''
            });
          }
        }
      } catch(e) {}
    });
  }

  // 2. Zones >20% behind baseline
  Object.keys(ZD).forEach(function(zid) {
    var z = ZD[zid];
    var active = CATS.filter(function(c){return z.els[c]&amp;&amp;(z.els[c].b>0||z.els[c].l>0);});
    if (!active.length) return;
    var gap = active.reduce(function(s,c){return s+(z.els[c].b-z.els[c].l);},0)/active.length;
    if (gap > 20) {
      alerts.push({
        level: 'r',
        text: z.name+(z.street?' ('+z.street+')':'')+' — '+Math.round(gap)+'% behind baseline on average.',
        site: typeof SITE_NAME !== 'undefined' ? SITE_NAME : ''
      });
    } else if (gap > 10) {
      alerts.push({
        level: 'a',
        text: z.name+(z.street?' ('+z.street+')':'')+' — '+Math.round(gap)+'% behind baseline, at risk.',
        site: typeof SITE_NAME !== 'undefined' ? SITE_NAME : ''
      });
    }
  });

  var panel = document.getElementById('alerts-panel');
  var body  = document.getElementById('alerts-body');
  var count = document.getElementById('alerts-count');

  if (!alerts.length) {
    panel.classList.remove('has-alerts');
    return;
  }

  // Sort: red first
  alerts.sort(function(a,b){ return a.level==='r' &amp;&amp; b.level!=='r' ? -1 : 1; });

  count.textContent = alerts.length + ' alert' + (alerts.length===1?'':'s');
  body.innerHTML = alerts.map(function(a) {
    var col = a.level==='r' ? '#E24B4A' : '#BA7517';
    return '<div class=&quot;alert-row&quot;>'
      +'<div class=&quot;alert-dot&quot; style=&quot;background:'+col+';&quot;></div>'
      +'<div class=&quot;alert-txt&quot;>'+a.text+'</div>'
      +'<div class=&quot;alert-site&quot;>'+a.site+'</div>'
      +'</div>';
  }).join('');
  panel.classList.add('has-alerts');
}

// ── V4: Updated renderMetrics with trend arrows ───────────────────────────
function renderMetrics() {
  var vals  = Object.values(ZD);
  var tot   = Math.round(vals.map(ovr).reduce(function(a,b){return a+b},0) / vals.length);
  var rags  = vals.map(rag);
  var total = vals.length;
  var g     = rags.filter(function(r){return r==='g'}).length;
  var am    = rags.filter(function(r){return r==='a'}).length;
  var rb    = rags.filter(function(r){return r==='r'}).length;
  var prev  = loadPrevData();

  function mbar(label, val, pct, col, ta) {
    var pill = ta.sym ? '<span style=&quot;font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;background:'+ta.bg+';color:'+ta.col+';&quot;>'+ta.sym+'</span>' : '';
    return '<div class=&quot;met&quot;>'
      +'<div style=&quot;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;&quot;>'
      +'<span class=&quot;met-lbl&quot;>'+label+'</span>'
      + pill
      +'</div>'
      +'<div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;&quot;>'
      +'<span style=&quot;font-size:19px;font-weight:600;color:'+col+';&quot;>'+val+'</span>'
      +'</div>'
      +'<div style=&quot;height:5px;background:#eee;border-radius:3px;overflow:hidden;&quot;>'
      +'<div style=&quot;height:100%;width:'+Math.round(pct)+'%;background:'+col+';border-radius:3px;&quot;></div>'
      +'</div>'
      +'</div>';
  }

  document.getElementById('metrics').innerHTML =
    mbar('Overall progress', tot+'%',    tot,             '#3D5166', trendArrow(tot, prev?prev._tot:null)) +
    mbar('On programme',     g+' zones', g/total*100,     '#3B6D11', trendArrowCount(g, prev?prev._g:null)) +
    mbar('At risk',          am+' zones',am/total*100,    '#854F0B', trendArrowCount(am, prev?prev._a:null)) +
    mbar('Behind',           rb+' zones',rb/total*100,    '#A32D2D', trendArrowCount(rb, prev?prev._r:null));

  renderAlerts();
}
